#
# The single template that deploys the whole architecture. It creates the child stacks in order and
# passes each one the outputs it needs, so all five templates go in one bucket and only this one is
# submitted, while anyone who wants to replace a layer can deploy the child directly.
# Same arrangement as architectures/aws-pcs/assets/pcs-ml-cluster-deploy-all.yaml, and as
# architectures/sagemaker-hyperpod-eks/cfn-templates/nested-stacks/main-stack.yaml.
#
# S3BucketName and S3KeyPrefix decide where the children are fetched from. Overriding them is how
# an event serves its own copy, and how you test an unpublished change.

AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Amazon EKS GPU cluster for distributed inference and training: VPC, EKS cluster, system node
  group, EFA-enabled GPU node group in a cluster placement group, and the NVIDIA and EFA device
  plugins installed and verified on every GPU node.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Network
        Parameters:
          - PrimarySubnetAZ
          - SecondarySubnetAZ
          - VpcCidr
      - Label:
          default: Cluster
        Parameters:
          - KubernetesVersion
          - KubectlVersion
          - HelmVersion
          - NvidiaDevicePluginChartVersion
          - EfaDevicePluginChartVersion
          - SystemInstanceType
          - AdminRoleArn
          - ServiceIpv4Cidr
      - Label:
          default: GPU capacity
        Parameters:
          - GpuInstanceType
          - AmiType
          - SystemAmiType
          - NodeAmiId
          - NodeImagePackages
          - NodeImageRepoPackages
          - NodeImageRepoFiles
          - NodeImageRepoKeys
          - NodeImageAssertPaths
          - NodeImageAssertCommands
          - NodeImageRecipeArn
          - NodeImageVersion
          - NodeImageBuildInstanceType
          - NodeImageBuildInstanceProfile
          - GpuNodeCount
          - GpuRootVolumeSize
          - CapacityReservationId
          - CapacityReservationType
      - Label:
          default: Optional
        Parameters:
          - PrePullImage
          - DeployFsxLustre
          - FsxStorageCapacity
      - Label:
          default: Template location (override to deploy an unpublished copy)
        Parameters:
          - S3BucketName
          - S3KeyPrefix

Parameters:
  PrimarySubnetAZ:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: >-
      Availability Zone of the GPU nodes, and of the capacity reservation when there is one. EFA
      traffic and the cluster placement group stay inside one zone.
  SecondarySubnetAZ:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: A second Availability Zone, different from the first, for the EKS control plane subnet.
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/1[67]$
    Description: VPC CIDR, /16 or /17.
  KubernetesVersion:
    Type: String
    Default: "1.36"
    AllowedPattern: ^1\.[0-9]{2}$
    Description: >-
      Kubernetes version of the cluster. The GPU node group downloads a matching kubectl, whose
      version is its own parameter because it has to stay within one minor of this one.
  KubectlVersion:
    Type: String
    Default: "1.36.4"
    Description: kubectl the GPU node group's bootstrap downloads, within one minor of KubernetesVersion.
  HelmVersion:
    Type: String
    Default: "3.19.0"
    Description: Helm the GPU node group's bootstrap downloads.
  NvidiaDevicePluginChartVersion:
    Type: String
    Default: "0.20.0"
    Description: Chart version of nvidia-device-plugin. Every stack on a cluster pins the same one.
  EfaDevicePluginChartVersion:
    Type: String
    Default: "v0.5.32"
    Description: Chart version of aws-efa-k8s-device-plugin. Every stack on a cluster pins the same one.
  SystemInstanceType:
    Type: String
    Default: m7i.xlarge
    Description: >-
      Instance type of the two system nodes that carry CoreDNS and other cluster services. Check that
      the Region offers it: a type that is not offered fails the node group with "Unsupported".
  AdminRoleArn:
    Type: String
    Default: ""
    Description: >-
      Extra IAM role or user that receives cluster-admin. Needed when the stack is created by one
      principal and used by another, which is how a provisioned workshop account works.
  GpuInstanceType:
    Type: String
    Default: g7e.12xlarge
    AllowedValues:
      - g7.12xlarge
      - g7.24xlarge
      - g7.48xlarge
      - g7e.12xlarge
      - g7e.24xlarge
      - g7e.48xlarge
      - g6e.12xlarge
      - g6e.48xlarge
      - g5.12xlarge
      - g4dn.8xlarge
      - p4d.24xlarge
      - p4de.24xlarge
      - p5.48xlarge
      - p5en.48xlarge
      - p6-b200.48xlarge
      - p6-b300.48xlarge
    Description: GPU instance type.
  GpuNodeCount:
    Type: Number
    Default: 2
    MinValue: 0
    MaxValue: 8
    Description: >-
      Number of GPU nodes. Disaggregated inference needs at least 2. 0 builds the cluster and
      installs the device plugins with no GPU capacity, which is a cheap smoke test only.
  AmiType:
    Type: String
    Default: AL2023_x86_64_NVIDIA
    Description: >-
      EKS AMI type for the GPU nodes, used when no image input is given. Not an enumeration, so a type
      EKS adds later works without a template change, and EKS validates the value. It has to be a type
      whose bootstrap is nodeadm, which the AL2023 family is: the GPU launch template's user data is a
      nodeadm NodeConfig, and a type that bootstraps another way would not read it.
  SystemAmiType:
    Type: String
    Default: AL2023_x86_64_STANDARD
    Description: EKS AMI type for the system nodes. Not an enumeration; EKS validates the value.
  ServiceIpv4Cidr:
    Type: String
    Default: 172.20.0.0/16
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    Description: >-
      CIDR the cluster allocates Service addresses from. Exposed because it must not overlap VpcCidr,
      and VpcCidr is a parameter: leaving this fixed would make one VpcCidr value fail at cluster
      creation for a reason the error does not give.
  NodeAmiId:
    Type: String
    Default: ""
    AllowedPattern: ^(ami-[0-9a-f]{8,17})?$
    Description: >-
      Node AMI for the GPU nodes. Set it to boot from an image you already have, and leave the
      NodeImage inputs empty. How it was produced does not matter: awslabs/amazon-eks-ami, EC2 Image
      Builder, or your own pipeline. It has to carry nodeadm, a driver that enumerates the instance
      type's GPUs, and the NVIDIA container toolkit.
  NodeImagePackages:
    Type: String
    Default: ""
    Description: >-
      Comma-separated packages to build into the node image, each pinned to a version. Setting this
      builds an image and boots the GPU nodes from it. The build does not interpret the packages.
  NodeImageRepoPackages:
    Type: String
    Default: ""
    Description: >-
      Comma-separated packages that make the others resolvable, such as a vendor's -release package.
      Installed before anything else, which is what keeps install order out of NodeImagePackages.
  NodeImageRepoFiles:
    Type: String
    Default: ""
    Description: URLs of repository definitions the packages need, if any.
  NodeImageRepoKeys:
    Type: String
    Default: ""
    Description: URLs of signing keys to import before installing, if any.
  NodeImageAssertPaths:
    Type: String
    Default: ""
    Description: >-
      Paths the build asserts exist before it publishes the image. A build that installs a package and
      produces an image missing the binary that package exists to provide is the failure this catches.
  NodeImageAssertCommands:
    Type: String
    Default: ""
    Description: >-
      Semicolon-separated commands the build runs on the produced image, each of which has to exit
      zero. NodeImageAssertPaths proves a file arrived; these prove it works, which is a different
      claim: a kernel module can be present as a file and fail to load.
  NodeImageRecipeArn:
    Type: String
    Default: ""
    Description: >-
      An EC2 Image Builder recipe to build. Use this when you already maintain one: the stack then
      contributes the build environment and nothing about the contents.
  NodeImageBuildInstanceProfile:
    Type: String
    Default: ""
    Description: >-
      Name of the instance profile the image build runs with. Empty creates one whose role carries
      EC2InstanceProfileForImageBuilder and AmazonSSMManagedInstanceCore, which is what a build that
      authenticates for nothing it fetches needs. A payload from a private bucket or registry needs
      permissions this template cannot know, and where its resource policy names the role, that name
      has to exist before the build: that case supplies its own profile, whose role grants what
      Image Builder, Systems Manager and the payload's source require.

  NodeImageVersion:
    Type: String
    Default: 1.0.0
    AllowedPattern: ^[0-9]+\.[0-9]+\.[0-9]+$
    Description: >-
      Semantic version of the component and recipe the build composes. Image Builder resources are
      immutable per version, so changing what goes into the image needs this raised: reusing a version
      with different contents is rejected as an existing resource.
  NodeImageBuildInstanceType:
    Type: String
    Default: m5.large
    Description: >-
      Instance type that builds the image. The build does not need a GPU, so this is deliberately not
      a GPU type: GPU capacity is scarce, and what proves the image drives its GPUs is the node-side
      check rather than the build host.
  GpuRootVolumeSize:
    Type: Number
    Default: 300
    MinValue: 100
  CapacityReservationId:
    Type: String
    Default: ""
    Description: Targeted On-Demand Capacity Reservation or Capacity Block id. Empty launches On-Demand.
  CapacityReservationType:
    Type: String
    Default: targeted-odcr
    AllowedValues: [targeted-odcr, capacity-block]
  PrePullImage:
    Type: String
    Default: ""
    Description: >-
      Image pulled onto every GPU node once the nodes are verified. Started and not waited for, so
      it cannot roll the stack back.
  DeployFsxLustre:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Create an FSx for Lustre filesystem and install its CSI driver, for model weights that do not
      fit the node's local NVMe or should outlive the nodes.
  FsxStorageCapacity:
    Type: Number
    Default: 1200
    AllowedValues: [1200, 2400, 4800, 7200, 9600, 12000, 24000, 48000]
    Description: >-
      Filesystem size in GiB. An enumeration rather than a minimum, because FSx accepts only certain
      sizes and refuses the rest minutes into the deploy, in an error that names the service rather
      than this parameter. Add a size here if you need one these values do not cover.
  S3BucketName:
    Type: String
    Default: awsome-distributed-ai
    Description: Bucket holding the child templates.
  S3KeyPrefix:
    Type: String
    Default: templates/amazon-eks/
    Description: Key prefix of the child templates, with a trailing slash.

Conditions:
  UsesGivenAmi: !Not [!Equals [!Ref NodeAmiId, ""]]
  BuildsAnImage: !Or
    - !Not [!Equals [!Ref NodeImagePackages, ""]]
    - !Not [!Equals [!Ref NodeImageRecipeArn, ""]]

Rules:
  ImageInputsAreExclusive:
    Assertions:
      - Assert: !Or
          - !Equals [!Ref NodeAmiId, ""]
          - !And
            - !Equals [!Ref NodeImagePackages, ""]
            - !Equals [!Ref NodeImageRecipeArn, ""]
        AssertDescription: >-
          NodeAmiId names an image to use and the NodeImage inputs describe one to build, so they
          cannot both be set. Leave all of them empty to take the AMI EKS resolves for the cluster.
      - Assert: !Or
          - !Equals [!Ref NodeImagePackages, ""]
          - !Equals [!Ref NodeImageRecipeArn, ""]
        AssertDescription: >-
          NodeImagePackages builds from packages and NodeImageRecipeArn builds from a recipe you
          already maintain, so they cannot both be set.
  BuildFromPackagesNeedsAnAssertion:
    RuleCondition: !Not [!Equals [!Ref NodeImagePackages, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref NodeImageAssertPaths, ""]]
        AssertDescription: >-
          NodeImagePackages requires NodeImageAssertPaths. A build with nothing to assert publishes an
          image whose contents were never checked.
  # The five inputs below only mean anything to a build from packages. Left set alongside NodeAmiId or
  # NodeImageRecipeArn they are silently ignored, which looks like the build did not honour them.
  PackageInputsNeedPackages:
    RuleCondition: !Equals [!Ref NodeImagePackages, ""]
    Assertions:
      - Assert: !Equals [!Ref NodeImageRepoPackages, ""]
        AssertDescription: NodeImageRepoPackages has no effect without NodeImagePackages.
      - Assert: !Equals [!Ref NodeImageRepoFiles, ""]
        AssertDescription: NodeImageRepoFiles has no effect without NodeImagePackages.
      - Assert: !Equals [!Ref NodeImageRepoKeys, ""]
        AssertDescription: NodeImageRepoKeys has no effect without NodeImagePackages.
      - Assert: !Equals [!Ref NodeImageAssertPaths, ""]
        AssertDescription: >-
          NodeImageAssertPaths has no effect without NodeImagePackages. A recipe you maintain carries
          its own tests.
      - Assert: !Equals [!Ref NodeImageAssertCommands, ""]
        AssertDescription: NodeImageAssertCommands has no effect without NodeImagePackages.
  DistinctAvailabilityZones:
    Assertions:
      - Assert: !Not [!Equals [!Ref PrimarySubnetAZ, !Ref SecondarySubnetAZ]]
        AssertDescription: >-
          PrimarySubnetAZ and SecondarySubnetAZ must differ. EKS requires subnets in two
          Availability Zones.
  CapacityBlockNeedsReservation:
    RuleCondition: !Equals [!Ref CapacityReservationType, capacity-block]
    Assertions:
      - Assert: !Not [!Equals [!Ref CapacityReservationId, ""]]
        AssertDescription: >-
          CapacityReservationType=capacity-block requires CapacityReservationId.
  PrePullNeedsNodes:
    Assertions:
      - Assert: !Or
          - !Equals [!Ref PrePullImage, ""]
          - !Not [!Equals [!Ref GpuNodeCount, "0"]]
        AssertDescription: PrePullImage has nowhere to run when GpuNodeCount is 0.

Resources:
  PrerequisitesStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${S3BucketName}.s3.amazonaws.com/${S3KeyPrefix}eks-cluster-prerequisites.yaml"
      Parameters:
        PrimarySubnetAZ: !Ref PrimarySubnetAZ
        SecondarySubnetAZ: !Ref SecondarySubnetAZ
        VpcCidr: !Ref VpcCidr
        DeployFsxLustre: !Ref DeployFsxLustre
        FsxStorageCapacity: !Ref FsxStorageCapacity

  # Created only when an image input is given, and depending only on the network so the build runs
  # alongside the cluster rather than after it.
  NodeImageStack:
    Type: AWS::CloudFormation::Stack
    Condition: BuildsAnImage
    Properties:
      TemplateURL: !Sub "https://${S3BucketName}.s3.amazonaws.com/${S3KeyPrefix}eks-gpu-node-ami.yaml"
      Parameters:
        VpcId: !GetAtt PrerequisitesStack.Outputs.VpcId
        PrivateSubnetId: !GetAtt PrerequisitesStack.Outputs.PrivateSubnetId
        BuildInstanceType: !Ref NodeImageBuildInstanceType
        BuildInstanceProfileName: !Ref NodeImageBuildInstanceProfile
        KubernetesVersion: !Ref KubernetesVersion
        Packages: !Ref NodeImagePackages
        RepoPackages: !Ref NodeImageRepoPackages
        RepoFiles: !Ref NodeImageRepoFiles
        RepoKeys: !Ref NodeImageRepoKeys
        AssertPaths: !Ref NodeImageAssertPaths
        AssertCommands: !Ref NodeImageAssertCommands
        RecipeArn: !Ref NodeImageRecipeArn
        ComponentVersion: !Ref NodeImageVersion
        RecipeVersion: !Ref NodeImageVersion

  ClusterStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${S3BucketName}.s3.amazonaws.com/${S3KeyPrefix}eks-cluster.yaml"
      Parameters:
        ClusterName: !Ref AWS::StackName
        KubernetesVersion: !Ref KubernetesVersion
        AdminRoleArn: !Ref AdminRoleArn
        PrivateSubnetId: !GetAtt PrerequisitesStack.Outputs.PrivateSubnetId
        ControlPlaneSubnetId: !GetAtt PrerequisitesStack.Outputs.ControlPlaneSubnetId
        NodeSecurityGroupId: !GetAtt PrerequisitesStack.Outputs.NodeSecurityGroupId
        SystemInstanceType: !Ref SystemInstanceType
        SystemAmiType: !Ref SystemAmiType
        ServiceIpv4Cidr: !Ref ServiceIpv4Cidr
        FsxFileSystemId: !GetAtt PrerequisitesStack.Outputs.FsxFileSystemId

  GpuNodeGroupStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${S3BucketName}.s3.amazonaws.com/${S3KeyPrefix}eks-add-gpu-nodegroup.yaml"
      Parameters:
        ClusterName: !GetAtt ClusterStack.Outputs.ClusterName
        KubernetesVersion: !Ref KubernetesVersion
        KubectlVersion: !Ref KubectlVersion
        HelmVersion: !Ref HelmVersion
        NvidiaDevicePluginChartVersion: !Ref NvidiaDevicePluginChartVersion
        EfaDevicePluginChartVersion: !Ref EfaDevicePluginChartVersion
        PrivateSubnetId: !GetAtt PrerequisitesStack.Outputs.PrivateSubnetId
        NodeSecurityGroupId: !GetAtt PrerequisitesStack.Outputs.NodeSecurityGroupId
        ClusterSecurityGroupId: !GetAtt ClusterStack.Outputs.ClusterSecurityGroupId
        NodeRoleArn: !GetAtt ClusterStack.Outputs.NodeRoleArn
        GpuInstanceType: !Ref GpuInstanceType
        AmiType: !Ref AmiType
        NodeAmiId: !If [BuildsAnImage, !GetAtt NodeImageStack.Outputs.NodeAmiId, !Ref NodeAmiId]
        ClusterEndpoint: !GetAtt ClusterStack.Outputs.ClusterEndpoint
        ClusterCertificateAuthority: !GetAtt ClusterStack.Outputs.ClusterCertificateAuthority
        ClusterServiceCidr: !GetAtt ClusterStack.Outputs.ClusterServiceCidr
        GpuNodeCount: !Ref GpuNodeCount
        GpuRootVolumeSize: !Ref GpuRootVolumeSize
        CapacityReservationId: !Ref CapacityReservationId
        CapacityReservationType: !Ref CapacityReservationType
        PrePullImage: !Ref PrePullImage

Outputs:
  NodeAmiId:
    Description: >-
      Node AMI the GPU nodes booted from, empty when they used the EKS-optimised AL2023 NVIDIA AMI.
      Pass it back as NodeAmiId on a later deploy to skip the build.
    Value: !If [BuildsAnImage, !GetAtt NodeImageStack.Outputs.NodeAmiId, !Ref NodeAmiId]
  ClusterName:
    Description: Name of the cluster, which is the stack name.
    Value: !GetAtt ClusterStack.Outputs.ClusterName
  ClusterArn:
    Description: ARN of the cluster.
    Value: !GetAtt ClusterStack.Outputs.ClusterArn
  Region:
    Description: Region the cluster runs in.
    Value: !Ref AWS::Region
  KubeconfigCommand:
    Description: Run this first; every other command in the documentation assumes it.
    Value: !GetAtt ClusterStack.Outputs.KubeconfigCommand
  VpcId:
    Value: !GetAtt PrerequisitesStack.Outputs.VpcId
  PrivateSubnetId:
    Description: Subnet holding the nodes. An example that pins a pod to this subnet needs it.
    Value: !GetAtt PrerequisitesStack.Outputs.PrivateSubnetId
  GpuNodeGroupName:
    Value: !GetAtt GpuNodeGroupStack.Outputs.GpuNodeGroupName
  GpuInstanceType:
    Value: !GetAtt GpuNodeGroupStack.Outputs.GpuInstanceType
  BootstrapLogGroup:
    Description: Log group with the device plugin install and the per-node verification output.
    Value: !GetAtt GpuNodeGroupStack.Outputs.BootstrapLogGroup
  FsxFileSystemId:
    Description: FSx for Lustre filesystem id, empty when DeployFsxLustre is false.
    Value: !GetAtt PrerequisitesStack.Outputs.FsxFileSystemId
  FsxDnsName:
    Description: >-
      FSx for Lustre DNS name, empty when DeployFsxLustre is false. Read by a static PersistentVolume
      that binds to the filesystem.
    Value: !GetAtt PrerequisitesStack.Outputs.FsxDnsName
  FsxMountName:
    Description: FSx for Lustre mount name, empty when DeployFsxLustre is false.
    Value: !GetAtt PrerequisitesStack.Outputs.FsxMountName
