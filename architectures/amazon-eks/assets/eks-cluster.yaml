#
# The cluster and the nodes that carry cluster services, with no GPU-specific resources: GPU
# capacity is added by eks-add-gpu-nodegroup.yaml, which can be deployed against this cluster
# more than once and replaced without touching the cluster.

AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Amazon EKS cluster with API authentication, the EKS-native add-ons, and a system managed node
  group for CoreDNS and other cluster services. Takes its network from
  eks-cluster-prerequisites.yaml and adds no GPU capacity.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Cluster
        Parameters:
          - ClusterName
          - KubernetesVersion
          - AdminRoleArn
      - Label:
          default: Network (outputs of eks-cluster-prerequisites.yaml)
        Parameters:
          - PrivateSubnetId
          - ControlPlaneSubnetId
          - NodeSecurityGroupId
      - Label:
          default: System nodes
        Parameters:
          - SystemInstanceType
          - SystemNodeCount
      - Label:
          default: Cluster networking
        Parameters:
          - ServiceIpv4Cidr
      - Label:
          default: Shared storage for model weights (optional)
        Parameters:
          - FsxFileSystemId

Parameters:
  ClusterName:
    Type: String
    Description: Name of the EKS cluster to create.
    AllowedPattern: ^[a-zA-Z][a-zA-Z0-9-_]{0,99}$
  KubernetesVersion:
    Type: String
    Default: "1.36"
    AllowedPattern: ^1\.[0-9]{2}$
    Description: Kubernetes version. Must match every other template in the deploy.
  AdminRoleArn:
    Type: String
    Default: ""
    Description: >-
      Extra IAM role or user that receives AmazonEKSClusterAdminPolicy. The principal that creates
      the stack always has it. An event that provisions the stack with one role and hands the
      account to a participant with another needs this.
  PrivateSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet for the nodes.
  ControlPlaneSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Second private subnet, in another Availability Zone, for the control plane.
  NodeSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Node security group from the prerequisites stack.
  SystemAmiType:
    Type: String
    Default: AL2023_x86_64_STANDARD
    Description: >-
      EKS AMI type for the system nodes. Not an enumeration: EKS validates the value.
  SystemInstanceType:
    Type: String
    Default: m7i.xlarge
    Description: >-
      Instance type of the system node group. Any general-purpose type works. The default is the
      newest generation offered in every Region this architecture's GPU types appear in, because a
      type the Region does not offer fails the node group with an opaque "Unsupported - The requested
      configuration is currently not supported" that names neither the type nor the Region.
  SystemNodeCount:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 4
    Description: >-
      Number of nodes carrying the cluster's own workloads: CoreDNS, and the node-feature-discovery
      master the NVIDIA chart deploys, neither of which can run on a tainted GPU node. Two by
      default so that replacing one node leaves the other serving. It does not spread CoreDNS: the
      add-on asks for two replicas and its anti-affinity is a preference, so both land on one node.
  ServiceIpv4Cidr:
    Type: String
    Default: 172.20.0.0/16
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    Description: >-
      CIDR the cluster allocates Service IPs from. An input rather than a value left to EKS, because a
      node group that names its own AMI has to put this value in its own bootstrap configuration, and
      the value EKS picks on its own is not readable afterwards: ServiceIpv6Cidr is a readable
      attribute of the cluster and ServiceIpv4Cidr is not. Naming it is therefore the only way to
      output it. Fixing it also forgoes the collision avoidance EKS applies when it picks, so the
      default is outside the private range the VPC templates draw from, and it must not overlap
      VpcCidr.
  FsxFileSystemId:
    Type: String
    Default: ""
    Description: >-
      FSx for Lustre filesystem id from the prerequisites stack. A non-empty value installs the
      aws-fsx-csi-driver add-on. The PersistentVolume that binds to the filesystem is a Kubernetes
      object and is not created here; a static PersistentVolume binding to the filesystem is what mounts it.

Conditions:
  HasAdmin: !Not [!Equals [!Ref AdminRoleArn, ""]]
  WithFsx: !Not [!Equals [!Ref FsxFileSystemId, ""]]

Resources:
  ClusterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy

  Cluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Ref ClusterName
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt ClusterRole.Arn
      AccessConfig:
        AuthenticationMode: API
        BootstrapClusterCreatorAdminPermissions: true
      KubernetesNetworkConfig:
        ServiceIpv4Cidr: !Ref ServiceIpv4Cidr
      ResourcesVpcConfig:
        SubnetIds:
          - !Ref PrivateSubnetId
          - !Ref ControlPlaneSubnetId
        SecurityGroupIds:
          - !Ref NodeSecurityGroupId
        EndpointPublicAccess: true
        EndpointPrivateAccess: true
      Logging:
        ClusterLogging:
          EnabledTypes:
            - Type: api
            - Type: audit

  AdminAccessEntry:
    Type: AWS::EKS::AccessEntry
    Condition: HasAdmin
    Properties:
      ClusterName: !Ref Cluster
      PrincipalArn: !Ref AdminRoleArn
      AccessPolicies:
        - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
          AccessScope:
            Type: cluster

  NodeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  # Add-on versions are left at the default for the cluster version, which is what EKS supports
  # for that version.
  VpcCniAddon:
    Type: AWS::EKS::Addon
    Properties:
      ClusterName: !Ref Cluster
      AddonName: vpc-cni
      ResolveConflicts: OVERWRITE
  KubeProxyAddon:
    Type: AWS::EKS::Addon
    Properties:
      ClusterName: !Ref Cluster
      AddonName: kube-proxy
      ResolveConflicts: OVERWRITE
  PodIdentityAddon:
    Type: AWS::EKS::Addon
    Properties:
      ClusterName: !Ref Cluster
      AddonName: eks-pod-identity-agent
      ResolveConflicts: OVERWRITE
  # CoreDNS runs on nodes, so it waits for the system node group; otherwise the add-on reports
  # degraded until nodes appear.
  CoreDnsAddon:
    Type: AWS::EKS::Addon
    DependsOn: SystemNodeGroup
    Properties:
      ClusterName: !Ref Cluster
      AddonName: coredns
      ResolveConflicts: OVERWRITE
  FsxCsiAddon:
    Type: AWS::EKS::Addon
    Condition: WithFsx
    DependsOn: SystemNodeGroup
    Properties:
      ClusterName: !Ref Cluster
      AddonName: aws-fsx-csi-driver
      ResolveConflicts: OVERWRITE

  SystemNodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn:
      - VpcCniAddon
      - KubeProxyAddon
    Properties:
      ClusterName: !Ref Cluster
      NodegroupName: system
      NodeRole: !GetAtt NodeRole.Arn
      AmiType: !Ref SystemAmiType
      InstanceTypes:
        - !Ref SystemInstanceType
      Subnets:
        - !Ref PrivateSubnetId
      ScalingConfig:
        MinSize: !Ref SystemNodeCount
        DesiredSize: !Ref SystemNodeCount
        MaxSize: !Ref SystemNodeCount
      Labels:
        role: system

Outputs:
  ClusterName:
    Description: Name of the cluster.
    Value: !Ref Cluster
  ClusterArn:
    Description: ARN of the cluster.
    Value: !GetAtt Cluster.Arn
  ClusterSecurityGroupId:
    Description: >-
      Security group EKS created for the cluster. A launch template that sets its own security
      groups has to include this one, because EKS then stops adding it.
    Value: !GetAtt Cluster.ClusterSecurityGroupId
  NodeRoleArn:
    Description: IAM role of the nodes, reusable by a GPU node group stack.
    Value: !GetAtt NodeRole.Arn
  KubeconfigCommand:
    Description: Command that writes a kubeconfig entry for this cluster.
    Value: !Sub "aws eks update-kubeconfig --name ${Cluster} --region ${AWS::Region}"
  ClusterEndpoint:
    Description: >-
      API server endpoint. A node group that names its own AMI needs this, because EKS then merges no
      bootstrap user data of its own.
    Value: !GetAtt Cluster.Endpoint
  ClusterCertificateAuthority:
    Description: Base64 cluster CA, needed by a node group that names its own AMI.
    Value: !GetAtt Cluster.CertificateAuthorityData
  ClusterServiceCidr:
    Description: Service IPv4 CIDR, needed by a node group that names its own AMI.
    Value: !Ref ServiceIpv4Cidr
