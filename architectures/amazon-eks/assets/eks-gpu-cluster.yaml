Resources:
  # ---------------------------------------------------------------- network
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Ref PrimarySubnetAZ
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 8, 12]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public"
        - Key: kubernetes.io/role/elb
          Value: "1"
  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Ref PrimarySubnetAZ
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 8, 12]]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private"
        - Key: kubernetes.io/role/internal-elb
          Value: "1"
  ControlPlaneSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Ref SecondarySubnetAZ
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 8, 12]]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-control-plane"
  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: VPCGatewayAttachment
    Properties:
      Domain: vpc
  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway
  PrivateSubnetRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable
  ControlPlaneSubnetRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ControlPlaneSubnet
      RouteTableId: !Ref PrivateRouteTable
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      RouteTableIds:
        - !Ref PrivateRouteTable
        - !Ref PublicRouteTable

  # EFA requires all traffic between members of the same security group.
  NodeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EKS nodes and EFA traffic
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-nodes"
  NodeSecurityGroupSelfIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref NodeSecurityGroup
      IpProtocol: "-1"
      SourceSecurityGroupId: !Ref NodeSecurityGroup
  NodeSecurityGroupSelfEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref NodeSecurityGroup
      IpProtocol: "-1"
      DestinationSecurityGroupId: !Ref NodeSecurityGroup

  # ---------------------------------------------------------------- EKS cluster
  ClusterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
  Cluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Sub "${AWS::StackName}"
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt ClusterRole.Arn
      AccessConfig:
        AuthenticationMode: API
        BootstrapClusterCreatorAdminPermissions: true
      ResourcesVpcConfig:
        SubnetIds:
          - !Ref PrivateSubnet
          - !Ref ControlPlaneSubnet
        SecurityGroupIds:
          - !Ref NodeSecurityGroup
        EndpointPublicAccess: true
        EndpointPrivateAccess: true
      Logging:
        ClusterLogging:
          EnabledTypes:
            - Type: api
            - Type: audit
  AdminAccessEntry:
    Type: AWS::EKS::AccessEntry
    Condition: HasAdmin
    Properties:
      ClusterName: !Ref Cluster
      PrincipalArn: !Ref AdminRoleArn
      AccessPolicies:
        - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
          AccessScope:
            Type: cluster
  BootstrapAccessEntry:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref Cluster
      PrincipalArn: !GetAtt BootstrapBuildRole.Arn
      AccessPolicies:
        - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
          AccessScope:
            Type: cluster
  VpcCniAddon:
    Type: AWS::EKS::Addon
    Properties:
      ClusterName: !Ref Cluster
      AddonName: vpc-cni
      ResolveConflicts: OVERWRITE
  KubeProxyAddon:
    Type: AWS::EKS::Addon
    Properties:
      ClusterName: !Ref Cluster
      AddonName: kube-proxy
      ResolveConflicts: OVERWRITE
  CoreDnsAddon:
    Type: AWS::EKS::Addon
    DependsOn: SystemNodeGroup
    Properties:
      ClusterName: !Ref Cluster
      AddonName: coredns
      ResolveConflicts: OVERWRITE
  PodIdentityAddon:
    Type: AWS::EKS::Addon
    Properties:
      ClusterName: !Ref Cluster
      AddonName: eks-pod-identity-agent
      ResolveConflicts: OVERWRITE

  # ---------------------------------------------------------------- node groups
  NodeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
  SystemNodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn:
      - VpcCniAddon
      - KubeProxyAddon
    Properties:
      ClusterName: !Ref Cluster
      NodegroupName: system
      NodeRole: !GetAtt NodeRole.Arn
      AmiType: AL2023_x86_64_STANDARD
      InstanceTypes:
        - !Ref SystemInstanceType
      Subnets:
        - !Ref PrivateSubnet
      ScalingConfig:
        MinSize: 2
        DesiredSize: 2
        MaxSize: 2
      Labels:
        role: system

  GpuPlacementGroup:
    Type: AWS::EC2::PlacementGroup
    Properties:
      Strategy: cluster

  # One interface per network card, count and primary type taken from the NicLayout
  # mapping (describe-instance-types NetworkInfo.NetworkCards / EfaInfo). Card 0 is
  # DeviceIndex 0; every other card is DeviceIndex 1 with InterfaceType efa. Cards the
  # instance type does not have resolve to AWS::NoValue and drop out of the list.
  # Each interface carries the node security group (EFA self-traffic) and the EKS
  # cluster security group (control plane). Local NVMe is assembled as RAID0.
  GpuLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${AWS::StackName}-gpu"
      LaunchTemplateData:
        InstanceType: !Ref GpuInstanceType
        Placement: !If
          - UsePlacementGroup
          - GroupName: !Ref GpuPlacementGroup
          - !Ref AWS::NoValue
        InstanceMarketOptions: !If
          - IsCapacityBlock
          - MarketType: capacity-block
          - !Ref AWS::NoValue
        CapacityReservationSpecification: !If
          - HasReservation
          - CapacityReservationTarget:
              CapacityReservationId: !Ref CapacityReservationId
          - !Ref AWS::NoValue
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 300
              VolumeType: gp3
              DeleteOnTermination: true
        MetadataOptions:
          HttpPutResponseHopLimit: 2
          HttpTokens: required
        NetworkInterfaces:
          - DeviceIndex: 0
            NetworkCardIndex: 0
            InterfaceType: !If [PrimarySupportsEfa, efa, !Ref AWS::NoValue]
            Groups: [!Ref NodeSecurityGroup, !GetAtt Cluster.ClusterSecurityGroupId]
          - !If
            - HasCard1
            - DeviceIndex: 1
              NetworkCardIndex: 1
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroup, !GetAtt Cluster.ClusterSecurityGroupId]
            - !Ref AWS::NoValue
          - !If
            - HasCard2
            - DeviceIndex: 1
              NetworkCardIndex: 2
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroup, !GetAtt Cluster.ClusterSecurityGroupId]
            - !Ref AWS::NoValue
          - !If
            - HasCard3
            - DeviceIndex: 1
              NetworkCardIndex: 3
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroup, !GetAtt Cluster.ClusterSecurityGroupId]
            - !Ref AWS::NoValue
          - !If
            - HasCard4
            - DeviceIndex: 1
              NetworkCardIndex: 4
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroup, !GetAtt Cluster.ClusterSecurityGroupId]
            - !Ref AWS::NoValue
          - !If
            - HasCard5
            - DeviceIndex: 1
              NetworkCardIndex: 5
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroup, !GetAtt Cluster.ClusterSecurityGroupId]
            - !Ref AWS::NoValue
          - !If
            - HasCard6
            - DeviceIndex: 1
              NetworkCardIndex: 6
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroup, !GetAtt Cluster.ClusterSecurityGroupId]
            - !Ref AWS::NoValue
          - !If
            - HasCard7
            - DeviceIndex: 1
              NetworkCardIndex: 7
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroup, !GetAtt Cluster.ClusterSecurityGroupId]
            - !Ref AWS::NoValue
          - !If
            - HasCard8
