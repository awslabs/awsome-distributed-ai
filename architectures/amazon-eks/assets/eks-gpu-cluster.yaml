              NetworkCardIndex: 28
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroup, !GetAtt Cluster.ClusterSecurityGroupId]
            - !Ref AWS::NoValue
          - !If
            - HasCard29
            - DeviceIndex: 1
              NetworkCardIndex: 29
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroup, !GetAtt Cluster.ClusterSecurityGroupId]
            - !Ref AWS::NoValue
          - !If
            - HasCard30
            - DeviceIndex: 1
              NetworkCardIndex: 30
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroup, !GetAtt Cluster.ClusterSecurityGroupId]
            - !Ref AWS::NoValue
          - !If
            - HasCard31
            - DeviceIndex: 1
              NetworkCardIndex: 31
              InterfaceType: efa
              Groups: [!Ref NodeSecurityGroup, !GetAtt Cluster.ClusterSecurityGroupId]
            - !Ref AWS::NoValue
        UserData:
          Fn::Base64: |
            MIME-Version: 1.0
            Content-Type: multipart/mixed; boundary="==BOUNDARY=="

            --==BOUNDARY==
            Content-Type: application/node.eks.aws

            apiVersion: node.eks.aws/v1alpha1
            kind: NodeConfig
            spec:
              instance:
                localStorage:
                  strategy: RAID0
            --==BOUNDARY==--
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub "${AWS::StackName}-gpu"
  GpuNodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn:
      - VpcCniAddon
      - KubeProxyAddon
    Properties:
      ClusterName: !Ref Cluster
      NodegroupName: gpu
      NodeRole: !GetAtt NodeRole.Arn
      AmiType: AL2023_x86_64_NVIDIA
      Subnets:
        - !Ref PrivateSubnet
      LaunchTemplate:
        Id: !Ref GpuLaunchTemplate
        Version: !GetAtt GpuLaunchTemplate.LatestVersionNumber
      ScalingConfig:
        MinSize: !Ref GpuNodeCount
        DesiredSize: !Ref GpuNodeCount
        MaxSize: !If [GpuZero, 1, !Ref GpuNodeCount]
      Labels:
        role: gpu
        instance-type: !Ref GpuInstanceType
      Taints:
        - Key: nvidia.com/gpu
          Value: "true"
          Effect: NO_SCHEDULE

  # ---------------------------------------------------------------- bootstrap (CodeBuild)
  BootstrapLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/${AWS::StackName}-bootstrap"
      RetentionInDays: 30
  BootstrapBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: bootstrap
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - eks:DescribeCluster
                  - eks:DescribeNodegroup
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${BootstrapLogGroup.Arn}:*"
  BootstrapProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-bootstrap"
      ServiceRole: !GetAtt BootstrapBuildRole.Arn
      TimeoutInMinutes: 60
      Artifacts:
        Type: NO_ARTIFACTS
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BootstrapLogGroup
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: CLUSTER_NAME
            Value: !Ref Cluster
          - Name: GPU_NODE_COUNT
            Value: !Ref GpuNodeCount
          - Name: PRE_PULL_IMAGE
            Value: !Ref PrePullImage
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          env:
            variables:
              KUBECTL_VERSION: "1.34.1"
              HELM_VERSION: "3.19.0"
          phases:
            install:
              commands:
                - curl -sSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl" && chmod +x /usr/local/bin/kubectl
                - curl -sSL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp && mv /tmp/linux-amd64/helm /usr/local/bin/helm
                - aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"
            build:
              commands:
                - |
                  set -euo pipefail
                  send() { # status reason
                    [ -n "${CFN_RESPONSE_URL:-}" ] || return 0
                    printf '{"Status":"%s","Reason":"%s","PhysicalResourceId":"%s-bootstrap","StackId":"%s","RequestId":"%s","LogicalResourceId":"%s","Data":{}}' \
                      "$1" "$2" "$CLUSTER_NAME" "$CFN_STACK_ID" "$CFN_REQUEST_ID" "$CFN_LOGICAL_ID" > /tmp/resp.json
                    curl -sS -X PUT -H 'Content-Type:' --data-binary @/tmp/resp.json "$CFN_RESPONSE_URL"
                  }
                  trap 'send FAILED "bootstrap failed; see CodeBuild log $CODEBUILD_BUILD_ID"' ERR
                  helm repo add nvdp https://nvidia.github.io/k8s-device-plugin
                  helm repo add eks https://aws.github.io/eks-charts
                  helm repo update
                  helm upgrade --install nvdp nvdp/nvidia-device-plugin --namespace nvidia-device-plugin --create-namespace --wait --timeout 10m \
                    --set gfd.enabled=true \
                    --set-json 'tolerations=[{"key":"nvidia.com/gpu","operator":"Exists","effect":"NoSchedule"}]'
                  helm upgrade --install aws-efa-k8s-device-plugin eks/aws-efa-k8s-device-plugin --namespace kube-system --wait --timeout 10m \
                    --set-json 'tolerations=[{"key":"nvidia.com/gpu","operator":"Exists","effect":"NoSchedule"}]'
                  for i in $(seq 1 60); do
                    ready=$(kubectl get nodes -l role=gpu -o json | python3 -c 'import sys,json; ns=json.load(sys.stdin)["items"]; print(sum(1 for n in ns if n["status"].get("allocatable",{}).get("nvidia.com/gpu","0")!="0" and n["status"].get("allocatable",{}).get("vpc.amazonaws.com/efa","0")!="0"))')
                    echo "gpu nodes advertising GPU+EFA: $ready / $GPU_NODE_COUNT"
                    [ "$ready" -ge "$GPU_NODE_COUNT" ] && break
                    sleep 20
                  done
                  [ "$ready" -ge "$GPU_NODE_COUNT" ]
                  [ "$GPU_NODE_COUNT" -gt 0 ] || PRE_PULL_IMAGE=""
                  kubectl get nodes -l role=gpu -o custom-columns='NAME:.metadata.name,TYPE:.metadata.labels.node\.kubernetes\.io/instance-type,GPU:.status.allocatable.nvidia\.com/gpu,EFA:.status.allocatable.vpc\.amazonaws\.com/efa'
                  if [ -n "$PRE_PULL_IMAGE" ]; then
                    cat <<EOF | kubectl apply -f -
                  apiVersion: apps/v1
                  kind: DaemonSet
                  metadata: { name: prepull, namespace: kube-system }
                  spec:
                    selector: { matchLabels: { app: prepull } }
                    template:
                      metadata: { labels: { app: prepull } }
                      spec:
                        nodeSelector: { role: gpu }
                        tolerations: [{ key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }]
                        initContainers:
                          - { name: pull, image: "$PRE_PULL_IMAGE", command: ["true"] }
                        containers:
                          - { name: hold, image: public.ecr.aws/docker/library/busybox:1.36, command: ["sleep", "infinity"] }
                  EOF
                    kubectl rollout status daemonset/prepull -n kube-system --timeout=40m
                  fi
                  trap - ERR
                  send SUCCESS "device plugins installed on $ready GPU nodes"
  BootstrapTriggerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: start-build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: codebuild:StartBuild
                Resource: !GetAtt BootstrapProject.Arn
  BootstrapTrigger:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt BootstrapTriggerRole.Arn
      Code:
        ZipFile: |
          import json, urllib.request, boto3
          def respond(event, status, reason):
              body = json.dumps({"Status": status, "Reason": reason,
                                 "PhysicalResourceId": event.get("PhysicalResourceId", event["LogicalResourceId"]),
                                 "StackId": event["StackId"], "RequestId": event["RequestId"],
                                 "LogicalResourceId": event["LogicalResourceId"], "Data": {}}).encode()
              req = urllib.request.Request(event["ResponseURL"], data=body, method="PUT", headers={"Content-Type": ""})
              urllib.request.urlopen(req)
          def handler(event, context):
              if event["RequestType"] == "Delete":
                  respond(event, "SUCCESS", "nothing to delete"); return
              try:
                  boto3.client("codebuild").start_build(
                      projectName=event["ResourceProperties"]["ProjectName"],
                      environmentVariablesOverride=[
                          {"name": "CFN_RESPONSE_URL", "value": event["ResponseURL"]},
                          {"name": "CFN_STACK_ID", "value": event["StackId"]},
                          {"name": "CFN_REQUEST_ID", "value": event["RequestId"]},
                          {"name": "CFN_LOGICAL_ID", "value": event["LogicalResourceId"]},
                      ])
              except Exception as e:
                  respond(event, "FAILED", f"start_build: {e}")
  Bootstrap:
    Type: Custom::EksBootstrap
    DependsOn:
      - GpuNodeGroup
      - SystemNodeGroup
      - CoreDnsAddon
      - BootstrapAccessEntry
    Properties:
      ServiceToken: !GetAtt BootstrapTrigger.Arn
      ProjectName: !Ref BootstrapProject
      GpuInstanceType: !Ref GpuInstanceType
      GpuNodeCount: !Ref GpuNodeCount
      PrePullImage: !Ref PrePullImage

Outputs:
  ClusterName:
    Value: !Ref Cluster
  ClusterArn:
    Value: !GetAtt Cluster.Arn
  VPCId:
    Value: !Ref VPC
  GpuNodeGroup:
    Value: gpu
  GpuInstanceType:
    Value: !Ref GpuInstanceType
  Region:
    Value: !Ref AWS::Region
  KubeconfigCommand:
    Value: !Sub "aws eks update-kubeconfig --name ${Cluster} --region ${AWS::Region}"
