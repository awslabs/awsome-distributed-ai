AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Amazon EKS GPU cluster for distributed training and inference: VPC, EKS cluster, system
  node group, EFA-enabled GPU managed node group in a cluster placement group (optional
  targeted ODCR or Capacity Block), and a CodeBuild bootstrap that installs the NVIDIA and
  EFA device plugins and optionally pre-pulls a container image on every GPU node.

Parameters:
  PrimarySubnetAZ:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Availability Zone for the GPU nodes; the AZ of the ODCR shared into this account.
  SecondarySubnetAZ:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: A second Availability Zone for the EKS control plane subnet (different from PrimarySubnetAZ).
  GpuInstanceType:
    Type: String
    Default: p5.48xlarge
    AllowedValues:
      - g7e.12xlarge
      - g7e.24xlarge
      - g7e.48xlarge
      - p4d.24xlarge
      - p4de.24xlarge
      - p5.48xlarge
      - p5en.48xlarge
      - p6-b200.48xlarge
      - p6-b300.48xlarge
    Description: GPU instance type. The EFA interface count and layout follow the type (see the NicLayout mapping).
  GpuNodeCount:
    Type: Number
    Default: 2
    MinValue: 0
    MaxValue: 4
    Description: Number of GPU nodes (min = desired = max). 0 creates the cluster and device plugins without GPU capacity.
  CapacityReservationId:
    Type: String
    Default: ""
    Description: Capacity reservation for the GPU nodes (targeted ODCR or Capacity Block for ML). Leave empty for On-Demand or an open ODCR.
  CapacityReservationType:
    Type: String
    Default: targeted-odcr
    AllowedValues:
      - targeted-odcr
      - capacity-block
    Description: How CapacityReservationId is consumed. capacity-block sets MarketType=capacity-block and omits the placement group.
  KubernetesVersion:
    Type: String
    Default: "1.34"
  SystemInstanceType:
    Type: String
    Default: m6i.xlarge
    Description: Instance type of the 2-node system node group (CoreDNS and other cluster services).
  PrePullImage:
    Type: String
    Default: ""
    Description: Container image pulled onto every GPU node after the device plugins are installed. Empty skips the pull.
  AdminRoleArn:
    Type: String
    Default: ""
    Description: IAM role or user ARN that receives AmazonEKSClusterAdminPolicy in addition to the stack creator. Empty skips it.
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16

Mappings:
  NicLayout:
    g7e.12xlarge:
      Cards: "1"
      PrimaryEfa: "true"
    g7e.24xlarge:
      Cards: "2"
      PrimaryEfa: "true"
    g7e.48xlarge:
      Cards: "4"
      PrimaryEfa: "true"
    p4d.24xlarge:
      Cards: "4"
      PrimaryEfa: "true"
    p4de.24xlarge:
      Cards: "4"
      PrimaryEfa: "true"
    p5.48xlarge:
      Cards: "32"
      PrimaryEfa: "true"
    p5en.48xlarge:
      Cards: "16"
      PrimaryEfa: "true"
    p6-b200.48xlarge:
      Cards: "8"
      PrimaryEfa: "true"
    p6-b300.48xlarge:
      Cards: "17"
      PrimaryEfa: "false"

Conditions:
  HasReservation: !Not [!Equals [!Ref CapacityReservationId, ""]]
  HasAdmin: !Not [!Equals [!Ref AdminRoleArn, ""]]
  GpuZero: !Equals [!Ref GpuNodeCount, 0]
  IsCapacityBlock: !Equals [!Ref CapacityReservationType, capacity-block]
  UsePlacementGroup: !Not [!Condition IsCapacityBlock]
  PrimarySupportsEfa: !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, PrimaryEfa], "true"]
  HasCard1: !Or
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "2"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "4"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "8"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "16"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "17"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  HasCard2: !Or
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "4"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "8"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "16"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "17"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  HasCard3: !Or
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "4"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "8"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "16"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "17"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  HasCard4: !Or
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "8"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "16"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "17"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  HasCard5: !Or
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "8"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "16"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "17"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  HasCard6: !Or
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "8"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "16"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "17"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  HasCard7: !Or
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "8"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "16"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "17"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  HasCard8: !Or
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "16"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "17"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  HasCard9: !Or
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "16"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "17"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  HasCard10: !Or
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "16"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "17"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  HasCard11: !Or
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "16"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "17"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  HasCard12: !Or
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "16"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "17"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  HasCard13: !Or
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "16"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "17"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  HasCard14: !Or
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "16"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "17"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  HasCard15: !Or
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "16"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "17"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  HasCard16: !Or
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "17"]
    - !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  HasCard17: !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  HasCard18: !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  HasCard19: !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  HasCard20: !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  HasCard21: !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  HasCard22: !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  HasCard23: !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  HasCard24: !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  HasCard25: !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  HasCard26: !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  HasCard27: !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  HasCard28: !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  HasCard29: !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
  HasCard30: !Equals [!FindInMap [NicLayout, !Ref GpuInstanceType, Cards], "32"]
