---
# yamllint disable rule:line-length
- name: Enable AL2023 NVIDIA repository
  ansible.builtin.dnf:
    name: nvidia-release
    state: present

- name: Install running-kernel build dependencies
  ansible.builtin.dnf:
    name:
      - "kernel-devel-{{ ansible_kernel }}"
      - "kernel-headers-{{ ansible_kernel }}"
    state: present

- name: Install NVIDIA data-center driver
  ansible.builtin.dnf:
    name: nvidia-driver-cuda
    state: present

- name: Reboot after NVIDIA driver installation
  ansible.builtin.reboot:
  when: nvidia_driver_allow_reboot

- name: Verify NVIDIA driver
  ansible.builtin.command: nvidia-smi --query-gpu=driver_version --format=csv,noheader
  changed_when: false
