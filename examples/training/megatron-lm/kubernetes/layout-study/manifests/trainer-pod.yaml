#
# One whole-instance pod for comparing Megatron-LM parallelism layouts across instances. 1.create-pods.sh renders
# it three times: megatron-head (rank 0 in every run), megatron-near (second instance under the same layer-3
# network node as the head) and megatron-far (second instance under a different one). The pods only sleep;
# 2.run-layouts.sh starts and stops torchrun inside them with kubectl exec, so one set of pods serves every layout
# and placement.
#
# Training uses Megatron-LM's mock data, so no dataset or shared file system is needed. The pod runs as a
# non-root user with a read-only root filesystem and no capabilities; launch scripts, logs and caches go to /tmp.
apiVersion: v1
kind: Pod
metadata:
  name: megatron-${ROLE}
  namespace: ${NAMESPACE}
  labels:
    app: megatron-layouts
    role: ${ROLE}
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 14400
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  nodeSelector:
    node.kubernetes.io/instance-type: ${INSTANCE_TYPE}
    kubernetes.io/hostname: ${NODE}
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 64Gi
    - name: tmp
      emptyDir:
        sizeLimit: 100Gi
  containers:
    - name: megatron
      image: ${IMAGE}
      command: ["sleep", "14300"]
      env:
        - name: HOME
          value: /tmp
        - name: USER
          value: megatron
        - name: LOGNAME
          value: megatron
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: shm
          mountPath: /dev/shm
        - name: tmp
          mountPath: /tmp
      resources:
        requests:
          cpu: "150"
          memory: ${POD_MEMORY}
          nvidia.com/gpu: "${GPU_PER_NODE}"
          vpc.amazonaws.com/efa: "${EFA_PER_NODE}"
        limits:
          cpu: "150"
          memory: ${POD_MEMORY}
          nvidia.com/gpu: "${GPU_PER_NODE}"
          vpc.amazonaws.com/efa: "${EFA_PER_NODE}"
