apiVersion: v1
kind: Pod
metadata:
  name: data-prep
  namespace: ${NAMESPACE}
  labels:
    app: miles-data-prep
spec:
  containers:
    - name: data-prep
      image: python:3.11-slim
      command: ["sleep", "infinity"]
      env:
        - name: HF_TOKEN
          # Same Secret the RayCluster reads, so the token is never written into a file
          # that could be committed. Create it once:
          #   kubectl create secret generic hf-token \
          #     --from-literal=HF_TOKEN=hf_xxx -n "${NAMESPACE}"
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
              optional: true
      resources:
        requests:
          cpu: "4"
          memory: "16Gi"
        limits:
          cpu: "8"
          memory: "32Gi"
      volumeMounts:
        - name: fsx
          mountPath: /fsx
  volumes:
    - name: fsx
      persistentVolumeClaim:
        claimName: ${FSX_CLAIM}
  restartPolicy: Never
  terminationGracePeriodSeconds: 30
