#
# ⚠️  EXPERIMENTAL — same-node NVLink variant of ../manifests-pd-rdma/decode.yaml.
# See prefill.yaml in this directory for the full rationale and caveats
# (privileged all-GPU visibility, hostIPC/hostPID, podAffinity, UCX backend,
# CUDA_VISIBLE_DEVICES re-ordering). Everything not commented here is
# identical to that file.
#
#   cat manifests-pd-nvlink/*.yaml | envsubst '<whitelist>' | kubectl apply -f -
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsv41flash-decode
  labels:
    app: dsv41flash
    component: decode
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: dsv41flash
      component: decode
  template:
    metadata:
      labels:
        app: dsv41flash
        component: decode
        sglang-metrics: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "30000"
        prometheus.io/path: "/metrics"
    spec:
      hostIPC: true
      hostPID: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                - p6-b200.48xlarge         # plain EKS managed nodegroup
                - p6-b300.48xlarge
                - ml.p6-b200.48xlarge      # SageMaker HyperPod instance group
                - ml.p6-b300.48xlarge
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: dsv41flash
            topologyKey: kubernetes.io/hostname
      tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: "true"
        effect: NoSchedule
      containers:
      - name: sglang
        image: ${SGLANG_IMAGE}
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SGLANG_HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        # Keep the ~188.83 GiB Engram tables in host memory — see prefill.yaml.
        - name: SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE
          value: "1"
        - name: SGLANG_DISAGGREGATION_NIXL_BACKEND
          value: UCX
        - name: NIXL_LOG_LEVEL
          value: INFO
        - name: NCCL_SOCKET_IFNAME
          value: ^lo
        command:
        - bash
        - -c
        - |
          set -eu
          case "${NVIDIA_VISIBLE_DEVICES:-}" in
            ""|all|none|void) echo "ERROR: expected a device-plugin GPU allocation in NVIDIA_VISIBLE_DEVICES, got '${NVIDIA_VISIBLE_DEVICES:-}'"; exit 1 ;;
          esac
          ALL=$(nvidia-smi --query-gpu=index,uuid --format=csv,noheader,nounits | tr -d ' ')
          if [ "$(echo "${ALL}" | wc -l)" -ne 8 ]; then
            echo "ERROR: expected all 8 GPUs visible (privileged), nvidia-smi sees:"; echo "${ALL}"; exit 1
          fi
          ALLOC_UUIDS=""
          for dev in $(echo "${NVIDIA_VISIBLE_DEVICES}" | tr ',' ' '); do
            case "${dev}" in
              GPU-*) uuid="${dev}" ;;
              *)     uuid=$(echo "${ALL}" | awk -F, -v i="${dev}" '$1==i{print $2}') ;;
            esac
            [ -n "${uuid}" ] || { echo "ERROR: cannot resolve allocated GPU '${dev}'"; exit 1; }
            ALLOC_UUIDS="${ALLOC_UUIDS} ${uuid}"
          done
          REST=""
          for uuid in $(echo "${ALL}" | cut -d, -f2); do
            case " ${ALLOC_UUIDS} " in
              *" ${uuid} "*) ;;
              *) REST="${REST} ${uuid}" ;;
            esac
          done
          export CUDA_VISIBLE_DEVICES=$(echo ${ALLOC_UUIDS} ${REST} | tr ' ' ',')
          echo "CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES}"
          echo "allocated (tp=2 on --base-gpu-id 0):${ALLOC_UUIDS}"

          exec sglang serve \
            --trust-remote-code \
            --model-path deepseek-ai/DeepSeek-V4.1-Flash \
            --base-gpu-id 0 \
            --tp 2 \
            --ep-size 2 \
            --disaggregation-mode decode \
            --disaggregation-transfer-backend nixl \
            --disaggregation-bootstrap-port 8998 \
            --max-running-requests 256 \
            --reasoning-parser auto \
            --tool-call-parser auto \
            --enable-metrics \
            --host 0.0.0.0 \
            --port 30000
        ports:
        - containerPort: 30000
          name: http
        volumeMounts:
        - name: nvme-hf
          mountPath: /root/.cache/huggingface
        - name: nvme-tmp
          mountPath: /tmp
          subPathExpr: $(POD_NAME)
        resources:
          limits:
            nvidia.com/gpu: 2
        livenessProbe:
          httpGet:
            path: /health
            port: 30000
          initialDelaySeconds: 1800
          periodSeconds: 60
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 30000
          initialDelaySeconds: 180
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      # NVME_HOST_PATH — same rule as ../manifests-pd-rdma/prefill.yaml.
      - name: nvme-hf
        hostPath:
          path: ${NVME_HOST_PATH}/huggingface
          type: Directory
      - name: nvme-tmp
        hostPath:
          path: ${NVME_HOST_PATH}/tmp
          type: DirectoryOrCreate
