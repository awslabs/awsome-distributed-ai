#
# ⚠️  EXPERIMENTAL — same-node NVLink variant of ../manifests-pd-rdma/prefill.yaml.
#
# Goal: keep one engine per pod, but move the prefill→decode KV cache over
# NVLink (NIXL UCX backend → cuda_ipc) instead of EFA. SGLang can only create
# ONE NIXL backend per engine and cannot pick NVLink for a same-node peer and
# EFA for a remote one, so this variant forces the WHOLE group onto one node
# (podAffinity) and uses UCX everywhere. Do not mix it with the EFA manifests
# behind the same router: UCX and LIBFABRIC workers cannot exchange KV.
#
# Cross-pod CUDA IPC needs three things Kubernetes normally denies:
#   1. every engine process must be able to open the PEER's GPU memory, i.e.
#      see all 8 GPUs — `privileged: true` exposes every /dev/nvidia* node
#      regardless of the 2 GPUs the device plugin allocated (this BYPASSES the
#      GPU isolation Kubernetes normally gives you; treat the node as dedicated);
#   2. a shared IPC namespace (hostIPC) for the IPC handles / shm segments;
#   3. a shared PID namespace (hostPID) for pidfd-based handle import.
# The startup script below re-orders CUDA_VISIBLE_DEVICES so the 2 GPUs the
# device plugin actually allocated come first (→ --base-gpu-id 0 runs on them)
# while the other 6 stay visible for IPC. Kubernetes GPU accounting stays
# intact (nvidia.com/gpu: 2 is still requested).
#
# Unverified as of writing — see the README for what to check in the logs
# (UCX must report cuda_ipc; if it silently falls back to TCP, transfers are
# extremely slow).
#
# SGLANG_IMAGE and NVME_HOST_PATH are rendered by envsubst, the same two
# variables as the other manifest directories:
#
#   cat manifests-pd-nvlink/*.yaml | envsubst '<whitelist>' | kubectl apply -f -
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsv41flash-prefill
  labels:
    app: dsv41flash
    component: prefill
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: dsv41flash
      component: prefill
  template:
    metadata:
      labels:
        app: dsv41flash
        component: prefill
        sglang-metrics: "true"
      annotations:
        sglang.ai/bootstrap-port: "8998"
        prometheus.io/scrape: "true"
        prometheus.io/port: "30000"
        prometheus.io/path: "/metrics"
    spec:
      # Both REQUIRED for cross-pod CUDA IPC (see header).
      hostIPC: true
      hostPID: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                - p6-b200.48xlarge         # plain EKS managed nodegroup
                - p6-b300.48xlarge
                - ml.p6-b200.48xlarge      # SageMaker HyperPod instance group
                - ml.p6-b300.48xlarge
        # Pack every engine pod (prefill AND decode share app=dsv41flash) onto
        # the SAME node — NVLink does not cross nodes. The scheduler lets the
        # first pod through (it matches its own affinity term); later ones must
        # land next to it. Once the node's 8 GPUs are taken, extra replicas
        # stay Pending by design.
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: dsv41flash
            topologyKey: kubernetes.io/hostname
      tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: "true"
        effect: NoSchedule
      containers:
      - name: sglang
        image: ${SGLANG_IMAGE}
        imagePullPolicy: IfNotPresent
        # REQUIRED here (not just for EFA): exposes all 8 GPU device nodes.
        securityContext:
          privileged: true
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SGLANG_HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        # Keep the ~188.83 GiB DeepSeek-V4.1 Engram tables in host memory
        # instead of consuming ~94.42 GiB HBM per rank at TP2. Required on
        # every variant; 3P1D here means ~4 x 188.83 GiB of the node's ~1.9 TiB.
        - name: SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE
          value: "1"
        # UCX picks cuda_ipc for a same-host peer — that is the NVLink path.
        - name: SGLANG_DISAGGREGATION_NIXL_BACKEND
          value: UCX
        - name: NIXL_LOG_LEVEL
          value: INFO
        - name: NCCL_SOCKET_IFNAME
          value: ^lo
        command:
        - bash
        - -c
        - |
          set -eu
          # NVIDIA_VISIBLE_DEVICES holds the GPUs the device plugin allocated
          # to THIS pod (default deviceIDStrategy=uuid → "GPU-...,GPU-...";
          # with deviceIDStrategy=index it is "3,4"). privileged exposes every
          # /dev/nvidia* node, so nvidia-smi enumerates the whole node.
          case "${NVIDIA_VISIBLE_DEVICES:-}" in
            ""|all|none|void) echo "ERROR: expected a device-plugin GPU allocation in NVIDIA_VISIBLE_DEVICES, got '${NVIDIA_VISIBLE_DEVICES:-}'"; exit 1 ;;
          esac
          ALL=$(nvidia-smi --query-gpu=index,uuid --format=csv,noheader,nounits | tr -d ' ')
          if [ "$(echo "${ALL}" | wc -l)" -ne 8 ]; then
            echo "ERROR: expected all 8 GPUs visible (privileged), nvidia-smi sees:"; echo "${ALL}"; exit 1
          fi
          # Resolve the allocation to UUIDs whether the plugin passed UUIDs or indices.
          ALLOC_UUIDS=""
          for dev in $(echo "${NVIDIA_VISIBLE_DEVICES}" | tr ',' ' '); do
            case "${dev}" in
              GPU-*) uuid="${dev}" ;;
              *)     uuid=$(echo "${ALL}" | awk -F, -v i="${dev}" '$1==i{print $2}') ;;
            esac
            [ -n "${uuid}" ] || { echo "ERROR: cannot resolve allocated GPU '${dev}'"; exit 1; }
            ALLOC_UUIDS="${ALLOC_UUIDS} ${uuid}"
          done
          # Allocated GPUs first (→ --base-gpu-id 0 lands on them), the rest
          # after so their memory can still be opened via CUDA IPC.
          REST=""
          for uuid in $(echo "${ALL}" | cut -d, -f2); do
            case " ${ALLOC_UUIDS} " in
              *" ${uuid} "*) ;;
              *) REST="${REST} ${uuid}" ;;
            esac
          done
          export CUDA_VISIBLE_DEVICES=$(echo ${ALLOC_UUIDS} ${REST} | tr ' ' ',')
          echo "CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES}"
          echo "allocated (tp=2 on --base-gpu-id 0):${ALLOC_UUIDS}"

          exec sglang serve \
            --trust-remote-code \
            --model-path deepseek-ai/DeepSeek-V4.1-Flash \
            --base-gpu-id 0 \
            --tp 2 \
            --ep-size 2 \
            --disaggregation-mode prefill \
            --disaggregation-transfer-backend nixl \
            --disaggregation-bootstrap-port 8998 \
            --reasoning-parser auto \
            --tool-call-parser auto \
            --enable-metrics \
            --host 0.0.0.0 \
            --port 30000
        ports:
        - containerPort: 30000
          name: http
        - containerPort: 8998
          name: bootstrap
        volumeMounts:
        - name: nvme-hf
          mountPath: /root/.cache/huggingface
        - name: nvme-tmp
          mountPath: /tmp
          subPathExpr: $(POD_NAME)
        resources:
          limits:
            # Still requested so the scheduler packs 3P+1D = 8 GPUs correctly;
            # no EFA needed on the NVLink path.
            nvidia.com/gpu: 2
        livenessProbe:
          httpGet:
            path: /health
            port: 30000
          initialDelaySeconds: 1800
          periodSeconds: 60
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 30000
          initialDelaySeconds: 180
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      # NVME_HOST_PATH — same rule as ../manifests-pd-rdma/prefill.yaml.
      - name: nvme-hf
        hostPath:
          path: ${NVME_HOST_PATH}/huggingface
          type: Directory
      - name: nvme-tmp
        hostPath:
          path: ${NVME_HOST_PATH}/tmp
          type: DirectoryOrCreate
