#
# Same-node NVLink variant of ../manifests-pd-rdma/prefill.yaml — moves the
# prefill->decode KV cache over NVLink (NIXL UCX backend -> cuda_ipc) instead
# of EFA. SGLang creates ONE NIXL backend per engine and cannot mix NVLink for
# a same-node peer with EFA for a remote one, so this variant forces the WHOLE
# group onto one node (podAffinity) and uses UCX everywhere. Do not put it
# behind the same router as the EFA manifests: UCX and LIBFABRIC workers cannot
# exchange KV.
#
# Cross-pod CUDA IPC needs every engine process to be able to open the PEER's
# GPU memory, i.e. see all 8 GPUs. This is done WITHOUT `privileged` by setting
# NVIDIA_VISIBLE_DEVICES=all, which makes the NVIDIA runtime mount every
# /dev/nvidia* node while the pod stays unprivileged. It also needs a shared IPC
# namespace (hostIPC) for the IPC handles / shm segments and a shared PID
# namespace (hostPID) for pidfd-based handle import (hostPID is also used to see
# every GPU compute process for the GPU self-claim below).
#
# GPU assignment: because NVIDIA_VISIBLE_DEVICES=all is (deliberately) rewritten
# to "void" by the container runtime, the device-plugin allocation is NOT
# readable inside the pod. Rather than hard-code --base-gpu-id (which cannot
# stay disjoint once prefill/decode are scaled independently), each engine
# CLAIMS a free pair of physical GPUs at startup under a shared on-node lock:
#   busy = { GPUs with a live compute process (hostPID + nvidia-smi
#            --query-compute-apps) } UNION { GPUs held by another pod's VALID
#            lease }
# A lease is valid only if its GPU still has a live process OR the lease file is
# younger than GPU_LEASE_GRACE seconds (the startup-race window before the CUDA
# process appears); otherwise it is a crash orphan and is reclaimed. The engine
# claims the first tp contiguous free indices and runs with --base-gpu-id there.
# A preStop hook removes this pod's leases on graceful termination (the startup
# `exec sglang` replaces the shell, so an EXIT trap would not fire on SIGTERM).
#
# Verifying the NVLink fast path actually engaged: `Selected backend: UCX` alone
# does NOT prove it — UCX can silently fall back to TCP. Set UCX_LOG_LEVEL=info
# (e.g. `kubectl set env deploy/dsv41flash-prefill UCX_LOG_LEVEL=info`) and look
# for an intra-node worker config with `device(cuda_ipc/cuda)` in the log; that
# is the CUDA-IPC/NVLink data path. Residual `tcp/eth0` on rma_am/amo_am/ka is
# just the control plane and is normal.
#
# SGLANG_IMAGE and NVME_HOST_PATH are the only envsubst-rendered values, the
# same two as the other manifest directory:
#
#   cat manifests-pd-nvlink/*.yaml | envsubst '<whitelist>' | kubectl apply -f -
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsv41flash-prefill
  labels:
    app: dsv41flash
    component: prefill
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: dsv41flash
      component: prefill
  template:
    metadata:
      labels:
        app: dsv41flash
        component: prefill
        sglang-metrics: "true"
      annotations:
        sglang.ai/bootstrap-port: "8998"
        prometheus.io/scrape: "true"
        prometheus.io/port: "30000"
        prometheus.io/path: "/metrics"
    spec:
      # hostIPC + hostPID: shared IPC/PID namespaces for cross-pod CUDA IPC, and
      # hostPID also lets the self-claim below see every GPU compute process.
      hostIPC: true
      hostPID: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                - p6-b200.48xlarge         # plain EKS managed nodegroup
                - p6-b300.48xlarge
                - ml.p6-b200.48xlarge      # SageMaker HyperPod instance group
                - ml.p6-b300.48xlarge
        # Pack every engine pod (prefill AND decode share app=dsv41flash) onto
        # the SAME node — NVLink does not cross nodes.
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: dsv41flash
            topologyKey: kubernetes.io/hostname
      tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: "true"
        effect: NoSchedule
      containers:
      - name: sglang
        image: ${SGLANG_IMAGE}
        imagePullPolicy: IfNotPresent
        terminationMessagePolicy: FallbackToLogsOnError
        # NOT privileged. NVIDIA_VISIBLE_DEVICES=all (below) exposes all 8 GPU
        # device nodes; IPC_LOCK lets the runtime pin memory for CUDA IPC.
        securityContext:
          capabilities:
            add: ["IPC_LOCK"]
        env:
        # Makes the NVIDIA runtime mount all 8 /dev/nvidia* nodes without
        # privileged, so cross-pod CUDA IPC can open the peer's GPU memory.
        - name: NVIDIA_VISIBLE_DEVICES
          value: "all"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SGLANG_HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        # Keep the ~188.83 GiB DeepSeek-V4.1 Engram tables in host memory
        # instead of consuming ~94.42 GiB HBM per rank at TP2.
        - name: SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE
          value: "1"
        # UCX picks cuda_ipc for a same-host peer — that is the NVLink path.
        - name: SGLANG_DISAGGREGATION_NIXL_BACKEND
          value: UCX
        - name: NIXL_LOG_LEVEL
          value: INFO
        - name: NCCL_SOCKET_IFNAME
          value: ^lo
        # tp=2 -> claim 2 contiguous GPUs. GPU_LEASE_DIR is the shared on-node
        # lease dir; GPU_LEASE_GRACE (s) is the startup-race window before a
        # lease without a live process is reclaimable.
        - name: TP_SIZE
          value: "2"
        - name: GPU_LEASE_DIR
          value: /gpu-leases
        - name: GPU_LEASE_GRACE
          value: "900"
        command:
        - bash
        - -c
        - |
          set -eu
          NEEDS="${TP_SIZE:-2}"
          LEASE_DIR="${GPU_LEASE_DIR:-/gpu-leases}"
          LOCK="${LEASE_DIR}/.lock"
          GRACE="${GPU_LEASE_GRACE:-900}"
          mkdir -p "${LEASE_DIR}"

          # Full physical GPU list (index,uuid), ordered by index 0..7. All 8 are
          # visible because NVIDIA_VISIBLE_DEVICES=all.
          ALL=$(nvidia-smi --query-gpu=index,uuid --format=csv,noheader,nounits | tr -d ' ' | sort -t, -k1 -n)
          NGPU=$(echo "${ALL}" | wc -l)
          if [ "${NGPU}" -ne 8 ]; then
            echo "ERROR: expected 8 GPUs visible, saw ${NGPU}:"; echo "${ALL}"; exit 1
          fi
          # Order UUIDs by physical index -> CUDA_VISIBLE_DEVICES so a claimed
          # physical index maps directly to --base-gpu-id.
          export CUDA_VISIBLE_DEVICES=$(echo "${ALL}" | cut -d, -f2 | tr '\n' ',' | sed 's/,$//')

          # Atomically claim NEEDS contiguous free physical GPU indices. Busy set
          # = { GPUs with a live compute process } UNION { GPUs held by another
          # pod's VALID lease }. A lease is valid only if its GPU has a live
          # process OR the lease file is younger than GRACE (the startup-race
          # window); otherwise it is a crash orphan and is reclaimed here (the
          # preStop hook handles graceful release, this covers SIGKILL). flock-
          # serialized so concurrent prefill/decode starts never collide.
          claim() {
            exec 9>"${LOCK}"; flock 9
            used_uuids=$(nvidia-smi --query-compute-apps=gpu_uuid --format=csv,noheader 2>/dev/null | tr -d ' ' | sort -u)
            proc_idx=" $(echo "${ALL}" | while IFS=, read -r idx uuid; do
                           case " $(echo ${used_uuids}) " in *" ${uuid} "*) echo "${idx}";; esac
                         done | tr '\n' ' ') "
            now=$(date +%s)
            busy=" $( { for x in ${proc_idx}; do echo "${x}"; done
                        for f in ${LEASE_DIR}/gpu-*.lease; do
                          [ -e "${f}" ] || continue
                          o=$(cat "${f}" 2>/dev/null || true)
                          li=$(basename "${f}" .lease | sed 's/^gpu-//')
                          [ "${o}" = "${POD_NAME}" ] && continue
                          mtime=$(stat -c %Y "${f}" 2>/dev/null || echo 0)
                          if { case "${proc_idx}" in *" ${li} "*) true;; *) false;; esac; } \
                             || [ $((now - mtime)) -lt "${GRACE}" ]; then
                            echo "${li}"
                          else
                            rm -f "${f}"   # reclaim crash (SIGKILL) orphan
                          fi
                        done; } | sort -un | tr '\n' ' ') "
            echo "busy indices:${busy}" >&2
            base=""; i=0
            while [ $((i + NEEDS)) -le 8 ]; do
              ok=1; j=0
              while [ ${j} -lt ${NEEDS} ]; do
                case "${busy}" in *" $((i + j)) "*) ok=0; break;; esac
                j=$((j + 1))
              done
              [ ${ok} -eq 1 ] && { base=${i}; break; }
              i=$((i + 1))
            done
            [ -z "${base}" ] && { flock -u 9; echo "ERROR: no ${NEEDS} contiguous free GPUs (busy:${busy})" >&2; return 1; }
            j=0
            while [ ${j} -lt ${NEEDS} ]; do
              echo "${POD_NAME}" > "${LEASE_DIR}/gpu-$((base + j)).lease"
              j=$((j + 1))
            done
            flock -u 9
            echo "${base}"
          }

          BASE=$(claim)
          echo "prefill claimed physical GPUs ${BASE}..$((BASE + NEEDS - 1)) (--base-gpu-id ${BASE}, tp=${NEEDS})"
          echo "CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES}"

          exec sglang serve \
            --trust-remote-code \
            --model-path deepseek-ai/DeepSeek-V4.1-Flash \
            --base-gpu-id ${BASE} \
            --tp 2 \
            --ep-size 2 \
            --mem-fraction-static 0.92 \
            --disaggregation-mode prefill \
            --disaggregation-transfer-backend nixl \
            --disaggregation-bootstrap-port 8998 \
            --reasoning-parser auto \
            --tool-call-parser auto \
            --enable-metrics \
            --host 0.0.0.0 \
            --port 30000
        # Release this pod's GPU leases on graceful termination. `exec sglang`
        # replaced the startup shell, so a shell EXIT trap cannot fire on
        # SIGTERM — the preStop hook is what frees the leases promptly on
        # scale-down / rollout (a crash still relies on the claim self-heal).
        lifecycle:
          preStop:
            exec:
              command:
              - bash
              - -c
              - |
                LEASE_DIR="${GPU_LEASE_DIR:-/gpu-leases}"
                exec 9>"${LEASE_DIR}/.lock"; flock 9
                for f in "${LEASE_DIR}"/gpu-*.lease; do
                  [ -e "${f}" ] || continue
                  [ "$(cat "${f}" 2>/dev/null || true)" = "${POD_NAME}" ] && rm -f "${f}"
                done
                flock -u 9
        ports:
        - containerPort: 30000
          name: http
        - containerPort: 8998
          name: bootstrap
        volumeMounts:
        - name: nvme-hf
          mountPath: /root/.cache/huggingface
        - name: nvme-tmp
          mountPath: /tmp
          subPathExpr: $(POD_NAME)
        - name: gpu-leases
          mountPath: /gpu-leases
        resources:
          limits:
            # Still requested so the scheduler packs prefill+decode correctly;
            # no EFA needed on the NVLink path.
            nvidia.com/gpu: 2
        livenessProbe:
          httpGet:
            path: /health
            port: 30000
          initialDelaySeconds: 1800
          periodSeconds: 60
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 30000
          initialDelaySeconds: 180
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      # NVME_HOST_PATH — same rule as ../manifests-pd-rdma/prefill.yaml.
      - name: nvme-hf
        hostPath:
          path: ${NVME_HOST_PATH}/huggingface
          type: Directory
      - name: nvme-tmp
        hostPath:
          path: ${NVME_HOST_PATH}/tmp
          type: DirectoryOrCreate
      # Shared on-node lease dir for atomic GPU claiming across engine pods.
      - name: gpu-leases
        hostPath:
          path: ${NVME_HOST_PATH}/gpu-leases
          type: DirectoryOrCreate
