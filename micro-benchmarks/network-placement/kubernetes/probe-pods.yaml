#
# One probe pod per instance, each holding the whole instance (8 GPUs, 16 EFA interfaces on p5en.48xlarge), so that
# the scripts in this directory can run fi_pingpong and NCCL collectives between chosen pairs and orders of hosts.
# The pods only sleep; the scripts run the measurements with kubectl exec.
#
# Set parallelism and completions to the number of instances you want to measure, and adjust the instance type and
# the GPU and EFA counts for yours. activeDeadlineSeconds caps how long the instances are held (2 hours).
# The pods run as a non-root user with a read-only root filesystem and no capabilities; /tmp and /dev/shm are
# emptyDir volumes, which is all fi_pingpong, torchrun and NCCL need.
apiVersion: batch/v1
kind: Job
metadata:
  name: placement-probe
spec:
  completionMode: Indexed
  parallelism: 5
  completions: 5
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app: placement-probe
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        node.kubernetes.io/instance-type: p5en.48xlarge
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: placement-probe
              topologyKey: kubernetes.io/hostname
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        - name: tmp
          emptyDir:
            sizeLimit: 16Gi
      containers:
        - name: probe
          # PyTorch, NCCL, libfabric with the EFA provider (fi_pingpong, fi_info) and aws-ofi-nccl in one image.
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.2.0-efa
          command: ["sleep", "7100"]
          env:
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "96"
              memory: 512Gi
              nvidia.com/gpu: "8"
              vpc.amazonaws.com/efa: "16"
            limits:
              cpu: "96"
              memory: 512Gi
              nvidia.com/gpu: "8"
              vpc.amazonaws.com/efa: "16"
