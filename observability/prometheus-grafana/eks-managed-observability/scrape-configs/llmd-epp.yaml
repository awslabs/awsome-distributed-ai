# llm-d router Endpoint Picker (EPP) metrics (llm_d_epp_*). Scrapes the metrics
# port (http-metrics) of every llm-d EPP Service in any namespace, i.e. Services
# whose app.kubernetes.io/name ends in -epp, as created by the llm-d router Helm
# charts. The job sends no credentials, so EPP must serve /metrics without auth:
# set router.monitoring.prometheus.auth.enabled=false in the router values, which
# makes the chart pass --metrics-endpoint-auth=false to EPP. Sending the collector's
# ServiceAccount token instead would hand a cluster-wide credential to any Service
# that matches the labels below.
- job_name: 'llmd-epp'
  scrape_interval: 10s
  metrics_path: /metrics
  scheme: http
  kubernetes_sd_configs:
  - role: endpoints
  relabel_configs:
  - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
    action: keep
    regex: .+-epp
  - source_labels: [__meta_kubernetes_endpoint_port_name]
    action: keep
    regex: http-metrics
  # Series carry job="epp"
  - action: replace
    replacement: epp
    target_label: job
  - source_labels: [__meta_kubernetes_service_name]
    action: replace
    target_label: service
  - source_labels: [__meta_kubernetes_pod_node_name]
    action: replace
    target_label: kubernetes_node
  - source_labels: [__meta_kubernetes_pod_name]
    action: replace
    target_label: pod
  - source_labels: [__meta_kubernetes_namespace]
    action: replace
    target_label: namespace
