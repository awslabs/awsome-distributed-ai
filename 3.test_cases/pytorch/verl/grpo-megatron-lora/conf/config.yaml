# =============================================================================
# GRPO Training — Hydra Configuration
#
# This config is loaded by scripts/submit_training.py, which resolves all
# values and generates the CLI overrides for verl's main_ppo entrypoint.
#
# Usage:
#   python3 scripts/submit_training.py                           # defaults
#   python3 scripts/submit_training.py cluster=p6-b200-1node     # single node
#   python3 scripts/submit_training.py model=qwen3-coder-next    # switch model
#   python3 scripts/submit_training.py tracking=console           # no MLflow
#   python3 scripts/submit_training.py training.learning_rate=1e-4  # tune LR
#   python3 scripts/submit_training.py backend=megatron model=qwen25-72b  # Megatron
# =============================================================================

defaults:
  - backend: fsdp
  - cluster: p6-b200-6node
  - model: qwen3-8b
  - lora: enabled
  - data: eurus
  - sandbox: enabled
  - tracking: mlflow
  - profiling: torch
  - _self_

# =============================================================================
# Training Hyperparameters
# =============================================================================
training:
  learning_rate: 1e-5
  lr_warmup_steps: 10
  weight_decay: 0.1
  kl_loss_coef: 0.02
  train_batch_size: 96
  max_prompt_length: 2048
  # Raised 16384 -> 24576 on 2026-07-31 after measuring a truncation reward ceiling.
  #
  # At 16384, response_length/clip_ratio averaged 0.218 over 422 healthy steps and
  # response_length/max was pinned at exactly 16384 in EVERY step (fully right-
  # censored). A truncated response cannot score: incomplete code will not compile
  # and there is no \boxed{} to extract, so ~22% of every batch was a forced zero.
  # corr(clip_ratio, score) = -0.450 and corr(response_length, score) = -0.457, and
  # mean response length fell 9604 -> 8261 across a run: GRPO was learning BREVITY
  # rather than correctness. Implied p(correct | not truncated) was 0.5399 versus an
  # observed critic/score/mean of 0.4223 -- which is exactly the ~0.42 plateau that
  # 721 steps never escaped.
  #
  # At 24576: clip_ratio 0.218 -> 0.035, mean response 9132 -> 12022, and
  # critic/score/mean reached 0.470 by step 2 from base (above the old plateau).
  # ~3.5% still truncate, so the distribution remains mildly censored.
  #
  # COST: max_token_len (= prompt + response) is derived in submit_training.py and
  # propagates to ppo_max_token_len_per_gpu, rollout.max_model_len,
  # max_num_batched_tokens and both log_prob_max_token_len_per_gpu. For Qwen3-235B at
  # TP=8 this puts per-sequence KV at ~321 MB (20.5 GB for max_num_seqs=64 in a ~32 GB
  # pool, 1.56x margin) and raised step time ~473s -> ~672s. Going to 32768 leaves only
  # ~1.19x KV margin -- lower max_num_seqs first if you need it.
  max_response_length: 24576
  n_responses_per_prompt: 4
  ppo_mini_batch_size: 16
  ppo_micro_batch_size_per_gpu: 2
  total_epochs: 10
  data_truncation: error   # error | left | right | middle
  save_freq: 50
  test_freq: 50
  # Run validation once before the first optimizer step. Costs a full val pass
  # (~1h50m for the 8117-row mixed-code-math split at cap 24576), but with LoRA
  # the adapter is zero-initialised so step 0 == base model, making this the only
  # way to get a BASE held-out number on the same instrument as step-N validation.
  val_before_train: false
  max_num_seqs: 64

# =============================================================================
# Ray Job Submission
# =============================================================================
ray:
  address: ${oc.env:RAY_ADDRESS,http://localhost:8265}
  headers: ${oc.env:RAY_HEADERS,null}
  runtime_env: scripts/runtime_env.yaml
  no_wait: true

# =============================================================================
# Compile cache location — "fsx" (default) | "local"
# =============================================================================
# Where Triton / torch.compile / vLLM put their compile artifacts.
#
# "fsx"   — shared, survives across jobs and nodes. Correct for a shape that is
#           ALREADY cached: every rank only reads files that are already visible.
#
# "local" — node-local NVMe (/tmp). REQUIRED the first time a new shape compiles.
#           Triton writes a cubin and then immediately cuModuleLoads it; on FSx,
#           with 8 ranks/node writing concurrently, the file is not yet visible
#           and the load fails with
#             InductorError: Failed to run autotuning code block:
#             CUDA driver error: file not found
#           That killed raysubmit_VQwgS3DNfiNzdpaj at max_model_len=34816 on
#           2026-08-03. It is a write-visibility race on a network filesystem,
#           NOT the stale-artifact case described in build_verl_overrides, and
#           NOT an OOM. Bumping CACHE_STACK_VERSION does not fix it.
#
# Historical note: caches were moved to FSx because /tmp exhausted at 100 GB and
# caused an NCCL timeout (NOTES.md §24). That no longer applies on p6-b200 —
# /tmp is NVMe with ~462 GB free and the whole Triton cache is ~740 MB. Re-check
# `df -h /tmp` before using "local" on a different instance type.
#
# Cost of "local": each node compiles once per job instead of reusing a shared
# cache. Worth it — it keeps CUDA graphs, and enforce_eager (the other way to
# dodge the race) made rollout so slow that validation stalled for 8h.
compile_cache: fsx

# =============================================================================
# Secrets — read from environment, never committed
# =============================================================================
secrets:
  hf_token: ${oc.env:HF_TOKEN,""}
  mlflow_tracking_uri: ${oc.env:MLFLOW_TRACKING_URI,""}
