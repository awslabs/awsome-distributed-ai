# LoRA enabled — supports both FSDP (PEFT) and Megatron (mbridge) backends
enabled: true
rank: 32
alpha: 32

# FSDP (HuggingFace PEFT) settings — used when backend=fsdp
target_modules: all-linear
load_format: safetensors
layered_summon: true

# Megatron-Bridge settings — used when backend=megatron
megatron:
  type: lora
  dropout: 0.0
  merge: false
  target_modules: linear_qkv,linear_proj,linear_fc1,linear_fc2
