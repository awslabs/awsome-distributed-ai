# FSDP backend — HuggingFace PEFT LoRA, PyTorch FSDP sharding
# Suitable for models up to ~72B parameters
name: fsdp
verl_config_name: null  # uses verl default ppo_trainer

# FSDP does not use Megatron-Bridge or fused kernels
use_mbridge: false
use_fused_kernels: false

# FSDP-specific model flags
gradient_checkpointing: true
use_remove_padding: true
forward_prefetch: true
