# @package _global_
# Nsight Systems — deep GPU/NCCL analysis, ~20-30% overhead.
# View reports with Nsight Systems GUI (nsys-ui).
profiling:
  tool: nsys
  steps: [5]
  save_path: /fsx/data/verl/profiling
  profile_continuous_steps: false
  actor_enable: true
  actor_all_ranks: true
  actor_ranks: []
  critic_enable: true
  critic_all_ranks: true
  critic_ranks: []
