# Qwen3-235B-A22B — 235B MoE (22B active), 128 experts (8 active)
# Megatron backend required (qwen3_moe supported by mbridge v0.3.0)
#
# Architecture: 94 layers, hidden=4096, 64 Q / 4 KV heads (GQA),
#   128 experts (8 active), moe_intermediate=1536, vocab=151936
# Disk: ~440 GB (bf16 safetensors)
# model_type: qwen3_moe
#
# Parallelism for 48 GPUs (6 nodes x 8 B200):
#   TP=4, PP=3, CP=1, EP=4, ETP=1
#   Attention DP = 48 / (4*3*1) = 4
#   Expert EDP  = 48 / (1*4*3) = 4
#   Layers/stage: (94+2) / 3 = 32 (with account_for_embedding/loss_in_pipeline_split)
#   128/EP = 32 experts per GPU
#
# Per-GPU memory estimate (bf16, TP=4, PP=3, EP=4):
#   Expert params: 32 layers x 32 experts x 3 x 4096 x 1536 x 2B = ~37.7 GB
#   Attention/dense: 32 layers x 71.3M / TP=4 x 2B = ~1.1 GB
#   Total: ~39 GB per GPU — leaves ~144 GB on B200 (183 GB)
#
# Upstream reference: verl run_qwen3-235b_megatron_96gb.sh (TP=4,PP=8,EP=4 on 32 GPUs)
# Previous config (TP=4, PP=1, EP=4) OOM'd at vLLM init with TP=4 rollout.
# See NOTES.md sections 27-28 for full failure analysis.
name: Qwen3-235B-A22B
hf_path: Qwen/Qwen3-235B-A22B
fsx_path: ${cluster.fsx_home}/models/${model.name}
tensor_parallel_size: 4
# Disable /dev/shm model cache — the 440 GB disk footprint combined with
# param_offload (actor + ref) exhausts CPU RAM during vLLM init.
# See NOTES.md section 28.
use_shm: false

# Megatron parallelism (ignored by FSDP backend)
pipeline_parallel_size: 3
expert_parallel_size: 4
context_parallel_size: 1

# Rollout uses full-node TP for vLLM inference.
# 440 GB / 8 GPUs = ~55 GB/GPU — fits with gpu_memory_utilization=0.85.
# Previous TP=4 OOM'd: 440/4 = 110 GB > 0.85*183 = 155 GB budget minus KV cache.
rollout_tensor_parallel_size: 8

# vLLM memory — rollout TP=8 puts ~55 GB weights per GPU.
# Profiling (§35) showed GPU utilization at 8.7% with rollout being 78% of step time.
# Increasing gmu from 0.6 → 0.7 gives +18 GB KV cache (73 vs 55 GB), improving
# vLLM batch throughput.  Still safe: 0.7 * 183 = 128 GB budget, weights = 55 GB,
# KV cache = 73 GB.  If param_offload=False, actor weights (~41 GB) remain on GPU
# during rollout — effective KV = 128 - 55 - 41 = 32 GB.
#
# KV cache math at max_model_len=18432 (prompt 2048 + response 16384):
#   Per-seq KV at TP=8: ~222 MB (94 layers, 4 KV heads replicated, 64 head_dim, bf16)
#   max_num_seqs=64: 64 × 222 MB = 14.2 GB << 32 GB budget (2.25x safety margin)
#   Stable for 1231 steps in Run 1 and 349 steps in Run 3 at gmu=0.7.
gpu_memory_utilization: 0.7

# LoRA overrides — same MoE workarounds as Qwen3-30B-A3B.
# See qwen3-30b-a3b.yaml comments for detailed explanation of each.
lora_alpha: 64
# Attention-only by DEFAULT, which adapts 6.70B of 235B = 2.85% of weights; the 227B of
# MoE experts get ZERO adaptation.
#
# EXPERT LoRA IS VERIFIED WORKING (2026-08-07) — both documented blockers were wrong.
# To enable, add the expert MLP modules:
#   'model.lora_target_modules=linear_qkv\,linear_proj\,linear_fc1\,linear_fc2'
# (escape the commas or Hydra parses them as a list separator).
#
#   - README's "naming mismatch syncing LoRA to vLLM -> runtime errors" (verl#5479) DOES
#     NOT REPRODUCE: `lora_merge: true` below means verl merges the adapter into base
#     weights before syncing, so adapter tensor names never cross the boundary. 0 Tracebacks,
#     0 KeyError/naming hits over init + 7 steps of raysubmit_RrFbeS5J9266nr9B.
#     If you ever set lora_merge: false on an MoE model, expect #5479 to return.
#   - FOLLOWON.md's "1.68B trainable params/GPU -> ~20GB Adam -> will OOM" was WRONG BY 33x.
#     Megatron-Bridge peft/lora.py defaults `share_expert_adapters=True` (one adapter shared
#     across all local experts on the EP rank, not one per expert) and verl never references
#     that field, so the per-expert branch is unreachable. 128 experts / EP=4 = 32/GPU = the 32x.
#
# Measured at r=128: trainable 25,395,200 (0.13%) -> 76,185,600 (0.39%); actor/grad_norm
# 1.7-2.7x the attention-only control (mean 2.12x over 8 steps) (proof gradient reaches the expert adapters);
# actor/ppo_kl unchanged at ~1e-4 (proof the rollout policy still matches the actor);
# step time +3.5% (657s vs 635s). No OOM.
#
# STILL UNVERIFIED: the eval path (checkpoint -> actor/huggingface/adapter/ ->
# merge_adapter.sh -> vLLM serve) for an adapter containing expert modules. Run
# scripts/check_merge_parity.py before spending eval GPU-hours.
#
# 2026-08-07 EXPORT SIZE WARNING. The saved HF adapter is 105.7 GB (78 GB on disk), vs
# 1.1 GB attention-only. Names export correctly (linear_fc1 -> gate_proj+up_proj,
# linear_fc2 -> down_proj), but the export MATERIALISES ONE ADAPTER PER EXPERT:
#   2,162,688 params/expert/layer x 128 experts x 94 layers = 26.0B params
#   26.0B x 4 bytes = 104.1 GB ~= observed 105.7 GB
# against only 76,185,600 params actually trained -- a 342x inflation, because
# share_expert_adapters=True has no HF-PEFT representation and the shared adapter is
# broadcast to all 128 experts on save. Correct but 128x redundant.
# Consequences: ~78 GB per checkpoint (so ~312 GB for save_freq=25 to step 100, vs 36 GB
# for the whole attention-only tree). Merge and runtime-LoRA both remain FEASIBLE
# (merge writes +439 GB; runtime LoRA loads 545 GB on 1.46 TB), but check df -h /fsx
# first and budget the load time.
lora_target_modules: linear_qkv,linear_proj
lora_merge: true

# PPO mini-batch size override for DP=4 divisibility.
# With TP=4, PP=3, CP=1 on 48 GPUs: dp_world_size = 48 / (4*3*1) = 4.
# Megatron normalizes: ppo_mini_batch_size = config_value * n // dp_size.
# Default (16): 16 * 4 // 4 = 16 → 64 % 16 = 0 → valid.
ppo_mini_batch_size: 16

# Offloading overrides — profiling-driven optimization (§35).
#
# With LoRA (attention-only, rank=32), only ~12.6M params are trainable.
# Optimizer states (Adam fp32): ~100 MB.  Gradients (bf16): ~25 MB.
# Offloading these is pure overhead — the data is tiny but the sync barriers
# and D2H/H2D transfers still cost wall-clock time.
#
# param_offload is the big lever: the profiler showed 311 GB round-tripped
# per step (155 GB DtoH + 155 GB HtoD), costing 10.9s/step (34% of GPU time).
# This is the FROZEN BASE WEIGHTS being shuttled to/from CPU during the
# actor sleep/wake cycle.  With param_offload=False, these 41 GB stay on GPU.
#
# Risk: with param_offload=False, actor weights (~41 GB) occupy GPU memory
# during the vLLM rollout phase.  At gmu=0.7, vLLM budgets 128 GB; minus
# 55 GB weights (TP=8) and 41 GB actor = 32 GB for KV cache.  Each 18432-token
# sequence needs ~222 MB KV at TP=8, so 32 GB supports ~144 concurrent sequences.
# This is well above max_num_seqs=64, but monitor for OOM.
#
# Tier 1 (safe):      grad_offload=False, optimizer_offload=False
# Tier 2 (test first): param_offload=False (saves 10.9s/step)
param_offload: false
optimizer_offload: false
grad_offload: false

# Advanced optimizer offloading — DISABLED with offloading optimization (§35).
# With LoRA, optimizer states are ~100 MB — standard GPU-side Adam is faster.
# Re-enable if switching to full fine-tuning or if GPU memory becomes tight.
# optimizer_config:
#   optimizer_cpu_offload: true
#   optimizer_offload_fraction: 1.0
#   overlap_cpu_optimizer_d2h_h2d: true
#   use_precision_aware_optimizer: true

# Activation recomputation — reduces memory for 32-layer pipeline stages.
# Uniform full recomputation of 1 layer at a time (same as 30B config).
recompute:
  method: uniform
  granularity: full
  num_layers: 1

# vLLM CUDA graphs — disable enforce_eager for faster rollout inference.
# CUDA graphs avoid Python/CUDA launch overhead on repeated shapes.
# Safe to enable now that torch.compile is disabled and shapes are stable.
# If vLLM hits CUDA graph capture OOM, re-enable with: model.enforce_eager=true
enforce_eager: false
