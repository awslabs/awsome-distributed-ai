kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: fsx-sc
provisioner: fsx.csi.aws.com
parameters:
  # Must match the subnet and security group of your EKS worker nodes, or the
  # volume will provision but never mount. Set in env_vars, then:
  #   envsubst < lustre/storageclass.yaml | kubectl apply -f -
  subnetId: ${FSX_SUBNET_ID}
  securityGroupIds: ${FSX_SECURITY_GROUP_ID}
  deploymentType: PERSISTENT_2
  automaticBackupRetentionDays: "0"
  copyTagsToBackups: "true"
  perUnitStorageThroughput: "250"
  dataCompressionType: "LZ4"
  fileSystemTypeVersion: "2.15"
mountOptions:
  - flock
