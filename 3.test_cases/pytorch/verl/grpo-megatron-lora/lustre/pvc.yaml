apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # This name MUST match the claimName every workload mounts. All manifests in
  # kubernetes/ mount `fsx-lustre`, so that is the name used here.
  name: fsx-lustre
  namespace: ${KUBE_NAMESPACE}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: fsx-sc
  volumeName: fsx-pv
  resources:
    requests:
      storage: ${FSX_STORAGE_CAPACITY}
