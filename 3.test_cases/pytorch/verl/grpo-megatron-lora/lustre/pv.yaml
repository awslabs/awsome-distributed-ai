apiVersion: v1
kind: PersistentVolume
metadata:
  name: fsx-pv
spec:
  capacity:
    storage: ${FSX_STORAGE_CAPACITY}
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: fsx-sc
  csi:
    driver: fsx.csi.aws.com
    # All three come from `aws fsx describe-file-systems`:
    #   volumeHandle -> FileSystemId
    #   dnsname      -> DNSName
    #   mountname    -> LustreConfiguration.MountName (NOT the filesystem id)
    volumeHandle: ${FSX_FILESYSTEM_ID}
    volumeAttributes:
      dnsname: ${FSX_FILESYSTEM_ID}.fsx.${AWS_REGION}.amazonaws.com
      mountname: ${FSX_MOUNT_NAME}
  mountOptions:
    - flock
