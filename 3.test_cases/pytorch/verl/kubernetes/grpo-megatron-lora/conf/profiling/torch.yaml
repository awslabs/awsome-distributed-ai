# @package _global_
# PyTorch Profiler — Chrome trace output, ~5-15% overhead per profiled step.
# View traces in Perfetto (https://ui.perfetto.dev/) or Chrome chrome://tracing.
profiling:
  tool: torch
  steps: [3, 4, 5]
  save_path: /fsx/data/verl/profiling
  profile_continuous_steps: false
  actor_enable: true
  actor_all_ranks: false
  actor_ranks: [0]
  critic_enable: false
  critic_all_ranks: false
  critic_ranks: []
