# LoRA enabled — supports both FSDP (PEFT) and Megatron (mbridge) backends
enabled: true
rank: 32
alpha: 32

# FSDP (HuggingFace PEFT) settings — used when backend=fsdp
# NOTE: rollout.load_format is not configurable here. LoRA on FSDP requires
# safetensors, so scripts/submit_training.py hardcodes it.
target_modules: all-linear
layered_summon: true

# Megatron-Bridge settings — used when backend=megatron
megatron:
  type: lora
  dropout: 0.0
  merge: false
  target_modules: linear_qkv,linear_proj,linear_fc1,linear_fc2
